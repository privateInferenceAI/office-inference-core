- model_name: analyst
  litellm_params:
    model: openai/deepseek-flash
    api_base: https://api.deepseek.com
    api_key: os.environ/DEEPSEEK_API_KEY
  model_info:
    lane: provider
    provider: openai-compatible
- model_name: reader
  litellm_params:
    model: bedrock/amazon.nova-pro-v1:0
