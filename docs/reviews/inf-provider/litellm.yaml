litellm_settings:
  drop_params: true
  set_verbose: false
  num_retries: 0
  request_timeout: 120
  stream_timeout: 120
general_settings:
  custom_auth: custom_auth.user_api_key_auth
  custom_auth_run_common_checks: true
  enable_post_custom_auth_checks: true
