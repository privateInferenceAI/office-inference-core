      executive: {answered: true, docs: ["company/group-02/048411.csv"], contains: ["61,958"]}
    source_quote: "DP03 | 63.0 | Median household income (dollars) | 48,240 ... DP03 | 64.0 | Mean household income (dollars) | 61,958"

