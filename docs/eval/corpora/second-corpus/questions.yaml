- id: SYN_N05
  category: exact_number
  question: In the FY2025 transaction ledger, which vendor and approver are recorded
    on the 921.82 line dated 2025-01-02 for Waste and Recycling?
  expected:
    staff:
      answered: true
      docs:
      - company/second-synthetic/transaction-ledger.csv
      contains:
      - '921.82'
      - Copperfield Waste & Recycling
      - Camille Duval
    executive:
      answered: true
      docs:
      - company/second-synthetic/transaction-ledger.csv
      contains:
      - '921.82'
      - Copperfield Waste & Recycling
      - Camille Duval
  source_quote: 2025-01-02 | Copperfield Waste & Recycling | Service Delivery & Facilities
    Operations | 6240 Waste & Recycling | 921.82 | Camille Duval | Approved
  evidence: 'transaction-ledger.csv line 5. The original target, the 12,345.67 row
    at line 3,062, is beyond the indexed row range: the chunker treats a table over
    5,000 rows as a data dump, keeps bounded row groups up to its 200-chunk limit
    (indexed dates 2025-01-02 to 2025-05-28) and records the omission in a table_marker
    chunk. That limit is written up in the second-corpus evidence; this question was
    retargeted to an indexed row.'
