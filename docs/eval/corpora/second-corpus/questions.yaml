- id: PUB_P01
  category: contract_clause
  question: Under Intuit's Credit Agreement dated January 9, 2026, what is the base
    maximum Leverage Ratio the company may not exceed at the end of any four-consecutive-fiscal-quarter
    period, before any acquisition-related increase?
  expected:
    staff:
      answered: true
      docs:
      - company/second-public/company/intuit-inc/EX-10_2026-01-12_credit-agreement.htm
      contains:
      - '4.00'
  source_quote: The Company will not permit, as of the last day of any period of four
    consecutive fiscal quarters of the Company for which the financial statements
    have been, or are required to be, delivered pursuant to Section 5.08(a) or 5.08(b),
    the Leverage Ratio to be greater than 4.00 to 1.00
  evidence: '{"source_file": "company/intuit-inc/EX-10_2026-01-12_credit-agreement.htm",
    "locator": "Section 6.06 Maximum Leverage Ratio (extracted line 863)", "method":
    "html.parser, paragraph text", "command": "python3 verify.py company/intuit-inc/EX-10_2026-01-12_credit-agreement.htm
    ''The Company will not permit, as of the last day of any period of four consecutive
    fiscal quarters of the Company for which the financial statements have been, or
    are required to be, delivered pursuant to Section 5.08(a) or 5.08(b), the Leverage
    Ratio to be greater than 4.00 to 1.00''", "result": "OK line 863", "note": "The
    same sentence continues with a proviso allowing a 0.50 increase after a Qualified
    Material Acquisition; that is why the question asks for the base ratio."}'
