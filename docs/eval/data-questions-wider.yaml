# Wider data-question set for future measurement, assembled 2026-10-19.
#
# This is the live forty (docs/eval/data-questions.yaml, reproduced unchanged below) plus the
# twenty-six candidates from docs/eval/candidates/ at commit da08258 that passed mechanical validation:
# 66 questions in
# all. It is not the frozen instrument: the forty stay frozen for comparisons with earlier runs, and
# this file is what a future, harder measurement should point at. The per-candidate verdicts are in
# docs/eval/candidates/VALIDATION.md.
#
# Thirteen of the candidates state a computed answer, so their expected value is not literal in
# source_quote. Each carries a `derivation` block instead: the indexed operands, the operation and the
# result. The validator checks every operand against the named documents' text and recomputes the
# value; a question without a derivation still needs the value literally in source_quote or in the
# document. The section on derivation in VALIDATION.md states the rules.
#
# **Known baseline failure, left unchanged on purpose.** U05's absent_pattern "cafeteria" matches nine
# chunks in the current index: seven in IRS Publication 15's "cafeteria plan" tax text and two in a
# Minnesota school pesticide table's "Cafeteria and kitchen" cell. The question is still substantively
# unanswerable (no menu is indexed), but the suite's own rule says an absent_pattern must match zero
# chunks, so the validator reports U05 as failing. The forty are frozen for this change; replacing
# U05 is a separate edit to docs/eval/data-questions.yaml.
#
# The accepted candidates keep their own category names: aggregation, date_arithmetic, multi_hop and
# coverage. None of them duplicates a live question id; no id was rewritten.
#
# Run it with the existing runner, from the repository root on the box, with the eval image:
#
#   docker compose -f deploy/office/compose/docker-compose.yml --env-file rendered/env \
#     run -T --rm --no-deps --entrypoint python -v /opt/oi-core:/w:ro -w /w \
#     -e DATA_SUITE_QUESTIONS=/w/docs/eval/data-questions-wider.yaml eval \
#     /w/tests/fixtures/data_suite_run.py
#
# DATA_SUITE_QUESTIONS is the path inside the container, not the host path. Add --no-answers for the
# retrieval-only smoke test. The validator reads the same file directly:
#
#   DATABASE_URL=... python3 scripts/validate_data_questions.py docs/eval/data-questions-wider.yaml
#
# Header ends here; the live file's own header follows.

# Forty questions for the corpus in /opt/oi-core/documents, authored 2026-10-17.
#
# **Ground truth comes from the documents, not from the system's answers.** Every expected value below was read
# from the ingested source text (the `chunk_index` copy of the parser output) and the quote that carries it is in
# `source_quote`, so a reviewer can check the question before the runner asks it. Nothing here was written by
# looking at what the assistant said.
#
# The corpus is the group-01/02/03 corpus: `company/` for group-01 and group-02, `executive/` for group-03 plus
# the executive compensation memorandum. Documents are mostly public-domain filings and data tables with numeric
# names, so some questions name the document; a scoped question is a legitimate question, and it is the only way
# to keep a numeric table's answer unambiguous.
#
# Scoring, for the runner:
#   * `answered` is whether the system produced an answer grounded in the corpus at all.
#   * `docs` are the documents the retrieved passages must include for a retrieval hit.
#   * `contains` is compared case-insensitively after removing commas, dollar signs, percent signs and spaces,
#     so "48,240", "48240" and "$48,240" all match.
#   * `denied` means the access boundary must refuse or withhold: no passage from a document outside the role's
#     folders, and the answer must say it cannot see it rather than invent.
#   * For `expected.staff` and `expected.executive`, they differ only for the access category by design.
#
# **Three questions were corrected on 2026-10-19 after measurement showed them failing deterministically**: A06
# was ambiguous (the document states three uniqueness rules), P05 asked for a telephone number that the answer
# redaction masks by policy, and P06 asked for a single FPCON condition in a document that lists all four. Each
# entry says what changed and why; the diagnosis is docs/reviews/deterministic-failures-2026-10-19.md. The
# question count and the categories are unchanged.
version: 1
authored: "2026-10-17"
corrected: "2026-10-19"
corpus: "company/group-01, company/group-02, executive/group-03, executive/executive-compensation.md"

