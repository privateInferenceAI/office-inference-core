  # ------------------------------------------------ wider set: literal candidates (13)
  # From docs/eval/candidates/. Category names are the candidates' own. The thirteen computed
  # candidates follow in the next section, each with a derivation.
  - id: CAND_date_arithmetic_02
    category: date_arithmetic
    question: The FCC's order and notice of proposed rulemaking in MM Docket No. 96-197 lists an adoption date, a release date, a comment date, and a reply comment date. Which of those four dates is the latest?
    expected:
      staff:
        answered: true
        docs:
        - company/group-01/012148.doc
        contains:
        - January 7, 2002
    source_quote: 'Adopted:


      September 13, 2001


      Released:


      September 20, 2001


      Comment Date:  December 3, 2001


      Reply Comment Date: January 7, 2002

      '
    evidence: select doc_id, chunk_id, page_start, left(text, 450) from chunk_index where doc_id='company/group-01/012148.doc' and text ilike '%Reply Comment Date%' returns the four dates on the order's face; the reply comment date, January 7, 2002, is later than December 3, 2001, September 20, 2001 and September 13, 2001.
  - id: CAND_multi_hop_03
    category: multi_hop
    question: In Exhibit 10.19 to Apple's 2024 Form 10-K, the restricted stock unit award agreement's Notice of Grant includes a Vesting Commencement Date. According to the 2024 Form 10-K, over how many years do RSUs granted under the 2022 Employee Stock Plan generally vest?
    expected:
      staff:
        answered: true
        docs:
        - company/apple-ex10-1-2024.htm
        - company/apple-10k-2024.htm
        contains:
        - four years
    source_quote: 2022 EMPLOYEE STOCK PLAN ... RESTRICTED STOCK UNIT AWARD AGREEMENT ... RSUs granted under the 2022 Plan generally vest over four years
    evidence: select doc_id, chunk_id, left(text, 300) from chunk_index where (doc_id='company/apple-ex10-1-2024.htm' and text ilike '%Exhibit 10.19%') or (doc_id='company/apple-10k-2024.htm' and text ilike '%generally vest over four years%') returns the exhibit title naming the 2022 plan and the 10-K sentence stating four years.
  - id: CAND_multi_hop_04
    category: multi_hop
