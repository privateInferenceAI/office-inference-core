  - id: CAND_multi_hop_01
    category: multi_hop
    question: "According to the FCC's license renewal guide, broadcast station licenses are granted for eight years. The FCC's 2004 digital LPTV order allows three years from permit issuance to complete construction. If a station used both periods in full, how many years would they total?"
    expected:
      staff:
        answered: true
        docs:
        - company/group-02/069856.doc
        - company/group-02/545688.doc
        contains:
        - '11'
    source_quote: "Each original construction permit for the construction of a new digital low power television or television translator station shall specify a period of three years from the date of issuance of the original construction permit ... All broadcast station licenses are granted by the Commission for eight years."
    derivation:
      operands: ["three years", "eight years"]
      operation: sum
      result: "11"
    evidence: "select doc_id, chunk_id, left(text, 420) from chunk_index where doc_id in ('company/group-02/545688.doc','company/group-02/069856.doc') and (text ilike '%period of three years from the date of issuance%' or text ilike '%granted by the Commission for eight years%') order by doc_id returns both sentences; 3 + 8 = 11 years."

  - id: CAND_multi_hop_02
