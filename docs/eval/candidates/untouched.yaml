# Untouched-document coverage candidates, authored 2026-10-19.
#
# Each candidate is drawn from a document that no question in docs/eval/data-questions.yaml and none of the
# four probes in tests/fixtures/data_suite_run.py references. All are staff-visible company/ documents, so
# only the staff expectation is given. File types are recorded in untouched.evidence.md.
#
# Ground truth was read from chunk_index on the deployment; the carrying sentence is in source_quote and the
# verifying SQL is in the evidence file. These are drafts for review, not the live suite.

- id: CAND_UNTOUCHED_01
  category: coverage
  question: "In customs ruling NY F86667, what is the applicable HTS subheading for style #20320?"
  expected:
    staff: {answered: true, docs: ["company/group-02/592778.doc"], contains: ["6117.10.1010"]}
  source_quote: "The applicable subheading for style #20320 will be 6117.10.1010"
  evidence: "Read from page 1 of the ruling; 6117.10.1010 appears only in this document, in the sentence naming style #20320."

