    tier: [cloud, office]
    phase: C1
    verify: running record --actor someone without the dev flag exits non-zero
    status: verified
  - id: SEC-KEY-001
    title: Per-role virtual keys with hard budgets, one set per deployment
    tier: [cloud, office, hosted]
    phase: C1
    verify: exceeding a role budget is refused, not merely alerted, and the refusal is audited
    status: verified
    note: >-
      Enforcement verified on 2026-10-11: a capped role answered 422 "Budget has been exceeded" and a
      key scoped to one model answered 403 for another. The audit half was believed to need the
      caller, because LiteLLM_ErrorLogs stays empty through these refusals. That was wrong: the
      spend log records them with status='failure', a zero-token usage object, the reason under
      metadata.error_information, and the alias of the key that asked. The backfill now classifies
      them, so this closes when a refused call appears in the chain as denied rather than as a
      successful call with no tokens.
  - id: SEC-KEY-002
    title: The LiteLLM master key is used for administration only
    tier: [cloud, office]
    phase: C1
    verify: grep of every service's environment shows no master key outside the admin path
    status: verified
  - id: SEC-LEAST-001
    title: The role we hold in a client account is revocable and cannot read documents
    tier: [cloud, hosted]
    phase: C7
    verify: assume the role and attempt to read an object in the documents bucket; access denied
    status: open
  - id: SEC-SECRET-001
    title: Secrets live in Secrets Manager with a rotation procedure
    tier: [cloud, hosted]
