    status: open
  - id: SEC-TLS-001
    title: TLS terminates at the edge and nothing else listens publicly
    tier: [cloud, hosted]
    phase: C7
    verify: an external port scan of the instance address returns nothing, and HTTP redirects to HTTPS
    status: open
  - id: SEC-ACL-001
    title: Role-based access filtering happens inside the search, before any model sees a passage
    tier: [cloud, office]
    phase: C2
    verify: a staff-role query for executive content returns a denial and zero restricted passages in the trace
    status: verified
    note: >-
      Built 2026-10-12, recorded in docs/runbook.md step 3.8. The filter is a clause in the Qdrant query
      rather than a step after the search, because a retriever that fetches ten and discards three produces
      the right answer while the restricted text leaves the store, is counted, and sits one logging
      statement from a leak. Ten tests ship with it, written before the module existed as the build order
      requires: the decisive one asserts the acl clause is present in the query, because every other test in
      the file passes against a retriever that fetches everything and filters afterwards. Two roles over two
      document roots; per-user and per-group permissions are SEC-ACL-002 in C3. Status is open rather than
      verified because the proof has to run against the deployed store: a unit test can assert the clause is
      built, and only the store can show it is honoured.
      VERIFIED 2026-10-13 against the deployed store, recorded in docs/runbook.md step 3.8. The index held
      1059 company points and 1 executive point; a staff query for the chief executive's salary returned five
      company passages and no restricted figure, and a staff search for either restricted figure returned ten
      passages containing neither. Two things had to be fixed before that run meant anything, and both were
      found by running rather than by reading. First, the denial never fired: it was inferred from passages
      the store returned that the role could not see, and since the filter is in the query and the store
      honours it, that count stayed at zero and the client's policy on what a denied user is told was dead
      code. It now runs a second search against the complement of the role's roots and denies when the
      restricted best score beats the best permitted one. Second, the probe's own leak check ran for every
      role, so it reported the executive role as leaking the figures it is permitted to read and the run
      ended in failure with the permissions correct. A limitation is recorded rather than fixed: on a
      severance question the restricted chunk scored 0.4088 against a permitted 0.65, so no denial fired even
      though the memorandum answers it. The cause is that the 1,541-character memorandum is one chunk whose
      embedding averages salary, bonus, equity and severance, so it matches any single question weakly.
  - id: SEC-ACL-003
    title: What a denied user is told is the client's declared policy
    tier: [cloud, hosted]
    phase: C2
    verify: a manifest declaring silent produces no disclosure, denied produces one without a count, and
      counted produces one with it; an unrecognised mode is refused rather than defaulted; and in every
      mode the record still reports what was withheld
    note: >-
      Anthony's decision 2026-10-13: this is something a client turns on or off rather than a behaviour we choose for
      them. Declared in the manifest as access.denial with three modes, because the trade has three defensible
      answers. silent tells the user nothing and costs the ability to distinguish an incomplete answer from a complete
      one. denied says documents exist that may answer the question and they lack access, with no count, which reveals
      that restricted content EXISTS. counted adds how many passages were withheld, which implies how many documents
      hold it. The default is denied because a silent system returns a partial answer that looks complete, which is
      the confidently-wrong failure this product exists to avoid; a client who weighs the leak of existence more
      heavily sets silent and gets no disclosure at all. The dev cloud manifest declares counted, since a developer
      debugging a missing passage wants the number and there is no client to weigh the trade. The fact and the
      disclosure are separate fields on purpose: withheld and denied stay accurate in every mode so the record can
      report what happened, and only disclosure is governed by policy, so collapsing them would make silent mean "we
      withheld nothing", which is a lie the record would then carry. One test asserts the restricted figure appears
      nowhere in the result object rather than only in the passages, because a debug field is the same leak with a
      different name. Status is open because the proof has to run against the deployed store and a rendered env file,
      which is the next run. The schema says this belongs in the contract under a compliance profile, the same way the
      content modes do.
    status: verified
    note_verified: >-
      VERIFIED 2026-10-13 against the deployed store, all four parts of the verify line. silent produces no disclosure
      at all (None rather than an empty one, so a caller that forgets to check the mode has nothing to render). denied
      produces a disclosure naming the role and no count. counted produces one WITH a count. An unrecognised mode is
      REFUSED with a message saying a typo must not silently choose the more disclosing behaviour. And in every mode
      the record still reports what was withheld. THE DEPLOYED RUN FOUND THE COUNTED MODE CARRYING NO NUMBER, and the
      reason is the design that made the denial work: the access filter is in the query and the store honours it, so
      nothing restricted is ever returned and withheld is honestly zero on every question. A mode whose whole purpose
      is to say how many passages were withheld was therefore always silent about its number, in exactly the case it
      was written for, and it printed a sentence that looked complete. It now counts how many restricted passages
      MATCHED, which is the fact the user is being told about, and the message says at least because the count is over
      the search's limit rather than a total.
  - id: SEC-ACL-002
    title: Per-user and per-group document permissions beyond two folder roles
    tier: [cloud, hosted]
    phase: C3
    verify: a user outside a document's group cannot retrieve it by any query
    status: verified
    note: >-
      Closed 2026-10-14 on the C3 verification pass: three panel rounds, three reviewers, all three verdicts yes, and every finding fixed and re-tested. Evidence is in docs/review-log.md.
          The verify line is met against the deployed store, not argued from the source. Two roles over two
          document roots, declared in access.groups and access.users rather than in code: access_probe passes 4
          of 4 against the live stack, and acl_probe shows a staff session refused on the salary and bonus
          documents while an executive session reads them. One right is skipped with an explanation rather than
          silently: no role on this deployment exists that can claim beyond its grant, so the FORGED subject has
          nothing to forge. The panel's cold reader ran the refusal, the recording and the refusal list by hand
          and matched all three to the page.
          A limitation is recorded rather than fixed, carried from C2: on a severance question the restricted
          chunk scores below a permitted one, so no denial fires even though the memorandum answers the question.
          The cause is chunking, not permission, and it is in the manual where a reader will meet it.

  - id: SEC-REDACT-001
    title: PII is redacted before any frontier-bound request leaves, and the redaction is recorded
    tier: [cloud, hosted]
    phase: C2
    verify: a question containing an SSN reaches Bedrock with the pattern replaced, and the audit shows the data class
    status: verified
    note: >-
      Built 2026-10-13, recorded in docs/runbook.md step 3.12. The audit module named this gap in Phase 0: its
      four patterns are documented as not a compliance guarantee and this requirement owns the real engine,
      which has to run before anything leaves for a frontier model rather than only on the way into the record.
      Two jobs, and the order between them is the design. The gate asks whether the request may leave at all,
      reading the permitted classes from the manifest, and it runs BEFORE redaction, because redacting a
      regulated document and sending the remainder answers a different question than the one the client
      decided. The redaction asks what must not leave inside a request that may. It fails closed: an unset
      permission set, an unknown class and an unconfigured lane all refuse, because the alternative is a system
      that sends a client's confidential document because a variable was misspelled, silently, since the call
      succeeds. Three properties guard against doing nothing while reporting success, which is the failure this
      codebase keeps hitting: the redaction runs on the payload that would actually be sent and there is no
      code path returning the original alongside it; it walks every string rather than a list of fields,
      because the retrieved passages are where a client's identifiers live and a redactor that covers only the
      question leaves the actual risk untouched; and it is a single pass over ordered alternatives, so it cannot
      re-match its own output. The false-positive trade is made deliberately: shape decides whether to redact
      and the Luhn check only decides what the reader is told, because a card whose digits OCR damaged fails the
      check and is still a card. THE BOUND: this is pattern matching, it catches identifiers with a shape, and
      it does NOT catch a person's name, an address, or an account number written in words. It is a reduction
      in what leaves, not a guarantee about what cannot. Status is open because the proof has to run on the
      deployed store, writing to the real audit sink. The deployed run found two faults, both in the recording
      half. The redaction summary was being written into the audit payload, and the default content mode is
      hash, which stores a hash of the payload and not the payload, so on the arrangement the system ships with
      the record proved a call happened and proved NOTHING about the redaction: an operator asking whether
      anything was removed got a null. A summary is metadata rather than content, so it now has four columns of
      its own in migration 012 and is not governed by a setting about storing content. And the probe serialised
      the payload a second time with different separators, recording a hash that did not match the one the
      module computed, so the record looked correct and proved nothing about what was sent; `prepare()` now
      hands out the exact string it hashed. OPEN, a tamper-evidence gap rather than a correctness one: the audit
      chain's canonical string covers twelve fields and not the four new ones, so a hand-edited redaction count
      would still verify. Extending a hash chain's canonical form invalidates every existing row's hash, so it
      needs a version column and a verifier that reads the version per row. It is the first item for 3.14, which
      owns the audit record's lifecycle. VERIFIED 2026-10-13 against the deployed store. The request as
      assembled carried an SSN in the question and an SSN plus a card in a retrieved passage; what would have
      been sent carries neither, and the fee figure 145.00 survives because a figure is not an identifier. A
      regulated request is refused with no payload at all rather than a payload with a flag beside it. The
      audit, written through the deployment's own CLI and read back from Postgres, shows data_class=internal,
      redaction_count=3, redactions of two ssn and one card, and egress_allowed true, on the default content
      mode where the payload itself is stored as a hash and not as text: the run printed "content mode stored
      the payload as: None" beside "redactions={'ssn': 2, 'card': 1}", which is the fix visible in one line.
      The recorded prompt hash equals the one the module computed, which was the probe's own fault when it did
      not.
  - id: SEC-INJECT-001
    title: Prompt injection from document content cannot change the lane or the answer's boundary
    tier: [cloud, office, hosted]
    phase: C2
    verify: a document containing an instruction to reveal other documents produces a refusal
    status: verified
    note: >-
      Built 2026-10-13, recorded in docs/runbook.md step 3.13. Four controls and only one of them is a
      detector, because three are structural and hold regardless of what a passage says. The lane is decided
      from the manifest before any content is assembled, and there is deliberately NO code path from retrieved
      text to the data class, with a test asserting the absence rather than any behaviour: a function that
      computed a lane from content would be the vulnerability however carefully it checked, and no behaviour
      test would notice the day somebody added one. The boundary is the access filter at retrieval, which has
      already run and is not re-run because a passage asked for something, so an injection in a passage a role
      can see can only reach material already in front of it. Content is presented as data inside delimiters
      after the instruction, never concatenated into it, which is the difference between a document that says
      "ignore your instructions" and one that IS an instruction, decided by where the text sits rather than by
      what it says. The fourth control is a weighted detector that quarantines text aimed at the assistant
      rather than at a reader, and it is written as the signal it is. It is shaped around its false positives
      because that is what gets a detector turned off: the signals aim at second-person address and at attempts
      to change behaviour rather than at imperative language, and there are tests asserting that a fee schedule,
      an employee policy and a document about assistants all pass untouched. THE BOUND: a passage written to
      look like ordinary prose while steering the model is not caught by any pattern, and the structural three
      are what hold in that case. VERIFIED 2026-10-13 against the deployed store. A memo was installed in the
      corpus with the instruction embedded in its third section rather than as a bare command, because a bare
      command is the easy case; the ordinary retrieval path returned it as passage [1] for a question about the
      document's subject; the detector scored it 17 across four signals and withheld it; and neither the
      instruction's text nor the phrase naming the restricted folder appeared anywhere in the request that
      would have been sent. The refusal named the passage by the index the citations use and the record carried
      the signal names and a capped excerpt and never the passage. A SECOND BOUND, found by the deployed run:
      quarantine is per passage, and the fixture is one chunk of 964 characters, below the chunker's 384-token
      minimum, so the instruction and the ordinary sections are one passage and the legitimate content went with
      it. The answer is safe and the document is unusable, which is the right direction to fail in and still a
      real loss. The honest fixes are a chunker that splits on headings or a quarantine that removes the
      instruction rather than dropping the passage, and neither is in this step.

  # ---------------------------------------------------------------- audit and evidence
  - id: AUD-CHAIN-001
    title: The audit chain is append-only and every row is hash-chained
    tier: [cloud, office, hosted]
    phase: C1
    verify: an UPDATE and a DELETE on audit_events both raise; tests/test_audit_verify.py passes
    status: verified
  - id: AUD-ANCHOR-001
    title: The chain head is anchored off the machine on a schedule
    tier: [cloud, office, hosted]
    phase: C1
    verify: verify --anchor against an anchor written before a deliberate row deletion fails
    status: verified
  - id: AUD-PAYLOAD-001
    title: A stored payload is verified against its own hash
    tier: [cloud, office, hosted]
    phase: C1
    verify: rewriting a payload in an export makes verify fail
    status: verified
  - id: AUD-HASH-001
    title: The row hash covers every column that carries meaning
    tier: [cloud, office, hosted]
    phase: C8
    verify: editing the approval, prompt hash or completion hash column breaks the chain and fails verify
    status: open
    note: >-
      An audit of the manual against the migrations found that the row hash covers thirteen columns and
      not these four: approval, prompt_sha256, completion_sha256 and occurred_at. Editing one of them in
      the database leaves the chain verifying cleanly, so they are recorded evidence rather than chained
      evidence, and occurred_at is the one that matters most because the retention purge cuts on it.
      Closing it needs a versioned hash, because changing the canonical string would fail verification
      for every row written before the change unless the verifier knows which version hashed which row.
  - id: AUD-PURGE-001
    title: A retention purge writes a tombstone carrying the hash before and after
    tier: [cloud, office, hosted]
    phase: C1
    verify: run a purge under the maintenance setting and confirm a tombstone row with both hashes exists
    status: verified
  - id: AUD-MODE-001
    title: A per-data-class content mode of hash, redacted, or full, plus prompt and completion hashes
    tier: [cloud, hosted]
    phase: C1
    verify: in full mode a stored prompt hash matches the recorded prompt; in hash mode no content is stored
    status: verified
  - id: AUD-EXPORT-001
    title: The daily export ships to the client's bucket under Object Lock
    tier: [cloud, hosted]
    phase: C1
    verify: delete an exported object as root and confirm it is refused
    status: verified
  - id: AUD-LOCK-001
    title: The Object Lock mode and retention period are chosen deliberately and disclosed
    tier: [cloud, hosted]
    phase: C7
    verify: the contract and the bucket configuration name the same mode and period
    status: open
  - id: AUD-RETAIN-001
    title: Audit retention meets the compliance profile, six years for a broker-dealer
    tier: [cloud, hosted]
    phase: C1
    verify: a sec-17a4 manifest with 365 days fails validation
    status: verified

  # ---------------------------------------------------------------- data lifecycle
  - id: DATA-RETAIN-001
    title: Retention and deletion are defined for documents and conversations, not only the audit log
    tier: [cloud, office, hosted]
    phase: C2
    verify: a document past its retention is gone from Qdrant, from the object store, and from the answer
    note: >-
      VERIFIED 2026-10-13 against the deployed store, and the verify line's three places all hold. A fixture aged 800
      days: after the real run the vector index reports 0 points, the lexical index 0 rows, the manifest 0 rows, and
      the client's own file is GONE, and asking a question about it returns no passage from it. The object store is
      the half a job built by reusing the purge would miss, because DATA-PURGE-001 deliberately LEAVES the file: a
      client asking us to stop holding a copy still has their document, and a period running out means there is no
      document. THREE BEHAVIOURS PROVED BESIDE THE DESTRUCTION, and each is a way the mechanism could be wrong in the
      direction that cannot be undone. NO POLICY DESTROYS NOTHING: with no row in retention_policies the run examined
      0 and destroyed 0, because a default period invented here would delete a client's documents on a number they
      never agreed to. A HOLD BEATS A PERIOD: with a hold in force the run examined 1, destroyed 0 and counted 1 held.
      And A DRY RUN CHANGES NOTHING: examined 1, expired 1, destroyed 0, file still present, which matters because a
      rehearsal whose output does not match the real thing rehearses a different operation. AGE IS MEASURED FROM
      ingested_at AND NOT FROM THE FILE'S DATE, which is a fact about the client's filesystem rather than about the
      obligation: copying a folder resets every mtime, and a document whose date was reset would be retained for
      another period without anybody deciding to. The stores are cleared before the file is removed, and only one of
      those orders is recoverable: a failure between them leaves a file with no index, which re-ingesting fixes, while
      the other order leaves an index pointing at a file that is gone, which is a passage the system will cite and
      nobody can open. CONVERSATIONS ARE DEFINED but minimal: the table exists so the requirement's second half has
      something to bind to, and the assistant API that writes it arrives in Phase 4. Inventing its schema now would be
      inventing decisions about a component that does not exist.
    status: verified
  - id: DATA-PURGE-001
    title: A client-requested purge deletes content everywhere it is stored, including the vector index
    tier: [cloud, office, hosted]
    phase: C2
    verify: after a purge, the same question returns no passage from the deleted document
    status: verified
    note: >-
      Built 2026-10-13, recorded in docs/runbook.md step 3.14. EVERYWHERE is the requirement. The vector index
      is named because it is the obvious one, and the one that gets forgotten is whichever store was added most
      recently, which in this build is the lexical index from step 3.9: a second copy of every document, added
      six steps after the first, and a purge that clears the vector store and not that one still answers the
      question with a correct citation to a document that no longer exists. So the stores are an explicit list
      in services/retention/retention.py and a test reads the ingestion worker's write paths and asserts a
      purge store exists for each, which makes a new store added in a later step fail that test rather than
      fail in a client's question six months later. The result is recorded PER STORE rather than as a total, so
      a store that was never wired in is visible instead of looking like a store that had nothing to do; a
      total cannot show that one of three stores contributed nothing, and doing nothing is the shape of this
      bug. A purge that cannot reach a store reports complete false and exits non-zero, because reporting
      success because the reachable stores succeeded is how a client is told their data is gone while it is
      not. Status is open because the proof has to run against the deployed stores. BOUND, stated rather than
      hidden: there is no rollback, so a purge that fails part way leaves the document partly gone. The record
      says which stores confirmed, and re-running is safe because every delete is by filter rather than by a
      list of ids. VERIFIED 2026-10-13 against the deployed stores. A fixture carrying a reference that appears
      nowhere else was retrievable as the FIRST result for its question before the purge; a hold was placed and
      the purge was refused with the reason legal_hold while every store was measured unchanged; the hold was
      released and the purge cleared the vector index, the lexical index and the manifest, each confirmed by
      querying the store rather than by reading the purge's own report; and the same question asked afterwards
      returned no passage from the document. The record named all four stores including audit_payload reporting
      zero, which is the point of recording per store rather than as a total: a store that was never wired in
      looks like a store that had nothing to do, and only the per-store record tells them apart.
  - id: DATA-HOLD-001
    title: Legal hold blocks a purge
    tier: [cloud, hosted]
    phase: C2
    verify: a purge on a held document is refused and the refusal is recorded
    status: verified
    note: >-
      Built 2026-10-13, recorded in docs/runbook.md step 3.14. A deployment-scope hold has no document list, so
      a document uploaded after the hold was placed is covered by it: a hold that only covered what existed at
      the time is a hold with a gap in it, and the gap is where the document that matters ends up. The hold is
      checked in ONE query before any store is touched, because checking it per store means a hold obeyed by
      the store somebody remembered and ignored by the one they did not, which from the client's side is the
      same as no hold at all. The refusal names the hold, its scope, who placed it and why, and how to release
      it, because a refusal a person cannot act on is one they route around. VERIFIED 2026-10-13 against the
      deployed store, in the same run as DATA-PURGE-001: the hold was placed, the purge was refused with the
      reason legal_hold, and every store was measured before and after the refusal and was unchanged. The
      refusal named the hold id, its scope, who placed it and why, and the command to release it.
  - id: DATA-EXIT-001
    title: Termination destroys client data and produces evidence that it happened
    tier: [cloud, hosted, office]
    phase: DEPLOY
    verify: a teardown run produces a signed destruction record naming every store and its state
    status: verified
    note: >-
      Built 2026-10-13, recorded in docs/runbook.md step 3.14. VERIFIED against the deployed store, by running
      it: the teardown emptied the vector index, the lexical index, the ingestion manifest, the purge history
      and the holds, named every store with the verb that is true of it, and produced a record whose hash
      recomputes to itself from its own contents, which is the check a client can run without trusting us. The
      client's files are untouched, and that is the recovery path rather than an oversight: one ingest cycle
      rebuilt 1121 chunks from them, which was demonstrated after the run. The audit chain is deliberately kept
      and the record says so, because it is what lets the destruction be checked by someone who does not trust
      us. THREE FAULTS WERE FOUND BY RUNNING IT, all in the record rather than in the deletion. The teardown
      reported `deleted: 34` for a store it had only counted, so the record said something false in the one
      document whose purpose is to be checkable. The teardown reported `complete: true` while 34 audit records
      still held content, where a single-document purge in the same position reports incomplete: the same fact
      reported two ways, and the teardown's way is the one a client keeps for years. And the probe asserted
      exactly one destruction record, failing on its second run in a way that read as the record having been
      destroyed. OPEN, and it is a conflict between two requirements rather than a defect: content stored in the
      audit record CANNOT be purged, because the table is append-only and the hash chain covers the stored
      payload, so clearing it leaves the row unverifiable and updating the hash makes the chain a record of what
      somebody chose to leave in it. On this deployment CONTENT_MODE_INTERNAL is redacted, so 34 records hold
      redacted content and a document quoted in one of them cannot be destroyed. The mitigation is not to store
      content there, which is why the default is hash; a deployment that selects full is choosing to keep
      content it cannot later delete, and the record now says so rather than reporting success.
  - id: DATA-RESIDENCY-001
    title: Residency is enforced by the validator, not documented
    tier: [cloud, hosted]
    phase: C1
    verify: a global inference profile under hipaa fails validation; a remote-inference compliance manifest with no residency fails
    status: verified

  # ---------------------------------------------------------------- retrieval quality
  - id: RET-PARSE-001
    title: Scanned documents, tables, and reading order are handled by Docling
    tier: [cloud, office, hosted]
    phase: C2
    verify: a scanned fee-schedule fixture returns correct numbers in a table, and a scanned page returns text rather than nothing
    status: verified
    note: >-
      Verified 2026-10-12 on the reference instance, recorded in docs/runbook.md step 3.4. A one-page
      scan with no text layer returned 3,321 characters of markdown containing all seven graded
      values, each beside its own label, in correct two-column reading order, in 9 seconds on CPU. The
      structured output carries one page and two tables of 12 cells each with row and column indices
      and per-cell bounding boxes, so citations can point at a cell rather than a page. The first run
      reported no structured output at all and that was our request, not the service: the options were
      nested under one convert_options field, which the service ignored while answering success. Two
      pieces of follow-up work came out of the run and are recorded rather than folded in: the split
      table now belongs to the chunker in 3.5, and the per-page OCR confidence gap is RET-PARSE-002.
  - id: RET-PARSE-002
    title: A confidently wrong read is caught by redundancy, or disclosed, rather than trusted
    tier: [cloud, office, hosted]
    phase: C2
    verify: a damaged figure is caught by a format or arithmetic check, a figure that passes every check is disclosed as machine-read when cited, and a chunk read from a scanned page is labelled as such while one from a digital page is not
    note_verified: >-
      VERIFIED 2026-10-13 against the deployed store, all three parts of the verify line. PART ONE: the five shapes a
      defective read produced in the step 3.4 measurement are all caught, being an impossible date, 31 February, a
      percentage past a thousand, a figure larger than any a small business document carries, and a malformed
      thousands separator. And six intact figures including 145 percent and a parenthesised negative are NOT flagged,
      which is the harder half: a check that fires on correct documents is one that gets turned off. PART TWO: an
      unverified figure from a scanned passage is disclosed as machine-read, one the document's own arithmetic
      confirms is not, and the caveat travels inside the citation so it goes wherever the citation goes. PART THREE:
      the vector payload labels every chunk, with is_ocr true for the scanned publication and false for the digital
      documents. THE CEILING IS STATED WHERE IT IS IMPLEMENTED because a check described as catching OCR errors would
      be believed and this one catches the malformed quarter of them: a read that produces a different plausible
      number is not caught by anything here, and step 3.4 measured fourteen of fifteen wrong readings as exactly that.
            THE GAP THE ACCEPTANCE RUN REPORTED IS NOT REAL, corrected 2026-10-13 by the fidelity checker. The run found
      that chunk_index has no is_ocr column and concluded that a passage the lexical arm returns alone carries no scan
      label. The column is absent and that does not matter, because nothing builds a passage from that table.
      lexical_search returns chunk ids only, and for any id the dense arm did not return, search fetches the payload
      from Qdrant with with_payload true (retriever.py _fetch_payloads), so Passage.from_payload reads is_ocr from the
      vector payload on BOTH arms. Adding the column would be redundant work on a false premise. Recorded rather than
      deleted because the probe printed it and a reader of the probe would otherwise reach the same wrong conclusion.
      ALSO OPEN from the decision and unchanged: whether two
      independently staged engines disagree usefully on damaged printed English digits, how large the review queue
      actually is, and whether the client's own records can serve as the second source. Per-page confidence for triage
      was RESOLVED on 2026-10-13, since the parser returns the per-page report and the worker labels each chunk from
      the pages it covers.
    status: verified
    note: >-
      Decided by Anthony 2026-10-12, after four research angles, and recorded in full in
      docs/search-architecture.md under "An uncertain read". The short version: do it the way the
      profession does it, and not by putting eyes on every document. The failure being answered is the
      worst this product has. OCR misreads a character, the wrong number is faithful to the document as
      parsed, so retrieval finds it, the model cites it, and Layer 1 confirms the number is present in
      the cited passage because OCR is what put it there. Every check passes and the client receives a
      confident wrong figure with a real citation. Measured in docs/runbook.md step 3.4: forty trials
      carving defects into a cell whose truth is 145.00 produced fifteen wrong readings and confidence
      flagged one, seven percent, with fourteen wrong numbers passing at confidence 61 to 93. Four
      research angles, in docs/research/, then established that nobody detects this. No open-source
      project catches it, no vendor claims to, calibration cannot because rescaling is monotone, and the
      trades that need a right number never trusted one reading: a cheque carries its amount twice and
      both are read independently, and accounting reconciles against a bank feed rather than
      proofreading. So the controls, in order: format, range and checksum checks, whose honest ceiling is
      the malformed quarter of misreads and nothing else; cross-field arithmetic where a document has the
      relationships, line items to subtotal and subtotal plus tax to total; a second independent reading
      of any cited figure, as an escalation gate and never a vote, varying the stage as well as the engine
      because two engines over the same pixels make correlated errors; human review of what the controls
      flag, on the key-from-image screen, one field with the source fragment beside it; the override
      recorded as machine value against human value; and disclosure, where a figure that passed no
      arithmetic check and had no second source is cited as machine-read rather than implied correct. What
      this is not: a refusal, which fires on correct answers too; or a review of every document, since
      every page is read without a person and most documents get no review at all. Still open, and the
      first is the only one that changes what gets built: whether two independently staged engines
      disagree usefully on these documents, since the only measurement found was on synthetic Telugu
      characters and the number for damaged printed English digits does not exist; how large the review
      queue actually is, which decides whether it is a database query or a product surface; whether the
      client's own records can serve as the second source, which is later work; and per-page confidence
      for triage, which Docling computes and does not expose. That one is RESOLVED as of 2026-10-13:
      docling-serve serialised only the document-level rollup, so services/parser now wraps the same image
      and returns the per-page report, and the worker labels each chunk from the pages it covers. Verified
      on the reference instance: the 59-page publication reports pages 1 and 8 as OCR'd and 320 of its 358
      chunks as not, while the three HTML documents report no OCR at all. The document-level signal could
      not express that, which is why a mixed filing was labelled one way in full. Still open: how large the
      review queue is, which depends on a client's real paper rather than on synthetic damage and is
      therefore a fixture-corpus question. The engine question is
      settled by measurement in docs/runbook.md step 3.4b: over forty damaged readings of a known cell,
      RapidOCR was wrong on four and Tesseract on fifteen, Tesseract caught two of RapidOCR's four, and
      two failures beat both engines. Both of those were truncated readings, 14600 and 1450 for 14500,
      so a digit-count check catches them for nothing and belongs with the format control above. Two
      limits recorded rather than discovered later: confidence cannot see a page that was never scanned,
      so completeness has no check anywhere in this design; and a confirmation must be stored, or the
      same figure is flagged on every question.

  - id: RET-EMBED-001
    title: The embedding model and its preprocessing are recorded per collection, and a mismatch is refused
    tier: [cloud, office, hosted]
    phase: C2
    verify: a query against a collection built by a different model or preprocessing is refused, not answered
    note: >-
      The research's reversibility contract. Changing an embedding model means re-embedding every chunk, so the model
      id, revision, sha256, dimension, pooling, normalisation, query and passage prefixes, truncate dimension and
      chunker version are recorded per collection generation, and the read path refuses a mismatch rather than
      returning quietly worse results.
    status: verified
    note_verified: >-
      VERIFIED 2026-10-13 against the deployed store. The contract in force is recorded and readable: model_id
      BAAI/bge-m3, pooling cls, 1024 dimensions, chunker-v1, model_sha null. A contract with pooling moved from cls to
      mean is REFUSED, and the refusal NAMES the field rather than reporting that two hashes differ; a dimension
      change is refused too, so the new check subsumes the one that existed. The read path checks as well as the write
      path. THE DEPLOYED RUN FOUND TWO FAULTS AND BOTH WERE MINE. The first: the contract included dimension and
      embed_path, which are things the checking process computes about ITSELF rather than properties of the vectors,
      so the writer's contract and the reader's described the same model and still differed in two fields. The check
      then refused EVERY search, and the eval harness reported all ten questions as misses with the reason sitting in
      a detail field on every line: a contract that refuses everything and a corpus that answers nothing produce the
      same summary. The second: the comparison used .get() on both sides, so a field present with a null value and a
      field missing entirely read the same while the fingerprints over the dictionaries differed, and the refusal
      named nothing. Both are now tests. A change to the contract's SHAPE is re-recorded in place at the same
      generation, because starting a new one would say the vectors were built under a different contract and they were
      not. OPEN DEPENDENCY: model_sha is null on this build, so the model revision is unverifiable and the contract
      records the null rather than omitting the field.

  - id: RET-TABLE-001
    title: A table too large to be a document table is indexed in bounded chunks with an omission marker, and a data file above the size threshold becomes a card
    tier: [cloud, hosted, office]
    phase: C2
    verify: >-
      ingest a document with a 6,000-row table and a 3 MB CSV. The table produces no per-row entries, no more
      than 200 bounded row groups, and exactly one marker chunk naming the table, the total rows and the indexed
      row range; the CSV produces exactly one chunk of kind dataset whose text names the file, without the parser
      being called. A table of ordinary size keeps its per-row entries and gets no marker. The data suite then
      shows the giant dumps out of the top five for ordinary questions with no regression in the prose and
      cross-document categories.
    status: verified
    note: >-
      The row-per-entry rule is right for a business table and wrong for a data dump. On 2026-10-17 a 27,829-line
      CSV became tens of thousands of near-identical row chunks and appeared in 42 of 52 baseline retrievals,
      displacing the documents that held the answers (docs/reviews/baseline-v3.md). The cap is deliberately above
      every normal schedule at 5,000 rows, and data files are classified before parsing at 2 MB for spreadsheets
      and 4 MB for text dumps, so the expensive path is never entered for a file that should be a card.
      Measured 2026-10-18 on the rebuilt corpus (538 documents, 100,477 chunks, six cards, six dead letters):
      the 27,829-row dump fell from the top five of 15 baseline runs (42 of 260 passages) to 0 of 52 runs
      and 0 of 260 passages; exact-number retrieval rose from 3 of 8 to 6 of 8; prose and cross-document
      retrieval did not regress, and the access boundary did not move. See docs/reviews/after-v4.md.
  - id: RET-CHUNK-001
    title: Every embedded chunk is measured against the embedding model's input limit, and a chunk over it is refused rather than truncated
    tier: [cloud, hosted, office]
    phase: C2
    verify: >-
      ingest a document whose text is one unbroken run and one whose table is larger than the limit; every emitted
      chunk's token count, measured with the embedding model's own tokenizer, is at or under
      min(contract.max_input_length, budget) minus the margin, or the document is dead-lettered with a typed
      cause. No chunk is embedded with auto_truncate on, and a chunk that is silently truncated fails the row.
    status: verified
    note: >-
      The invariant the design stated and never enforced. Found on 2026-10-16 by loading a real corpus: 73 of 341
      documents carried at least one chunk past the recorded 4,096-token embedding limit and were embedded as
      their first tokens, and one 756 KB chunk assembled a prompt the provider refused. The rule lived in
      docs/search-architecture.md stage 2 and in the chunker's docstring, which is why it shipped unenforced: a
      design rule that is not a register row has no test that fails when it stops being true. Verified
      2026-10-17 on the rebuilt v3 index: every one of the first 30,706 chunks measured at or under 512 tokens
      (none over); the 756 KB unbroken run is 789 chunks with a 512 maximum; an oversized table is row groups
      that carry table_id, row_start, row_end and table_rows; the contract records chunker-v3,
      max_input_length 8192 and auto_truncate false; and the worker refuses to run while truncation is on.

  - id: RET-RERANK-001
    title: Reranking improves answer quality inside the latency budget
    tier: [cloud, office, hosted]
    phase: C2
    verify: reranking the fused candidate list stays inside the agreed latency budget and improves retrieval and support on the golden set
    note: >-
      Depth measured and decided for the cloud build, 2026-10-11, recorded in docs/runbook.md step 3.3 and in
      docs/search-architecture.md. A CPU reranker costs about 2.5 to 3 ms per token of candidate text on the reference
      instance, flat in candidate count, so a five-second budget buys three or four of our 500-token chunks. The stage
      therefore moves rather than shrinks: the cloud build reranks 40 to 50 candidates through Bedrock
      cohere.rerank-v3-5:0. The office build is out of scope here and decides its own reranking when it is built, on
      hardware that does not exist yet; what this measurement settles for it is only that a CPU reranker cannot serve
      it at our chunk size. The CPU reranker stays in the repository behind the bench profile as the instrument that
      produced the number. Prerequisite for the cloud path: the instance role's oi-core-dev-bedrock-invoke policy
      allows bedrock:InvokeModel on four model ARNs and needs bedrock:Rerank on the rerank model ARN. The cloud path
      also carries the data-classification gate, sending only chunks whose class permits a frontier call and recording
      when no reranker ran, and it degrades to the fused order under throttling rather than failing. Still open:
      whether reranking improves retrieval on our documents, which is the golden set's question and not the latency
      measurement's.
    status: verified
    note_verified: >-
      VERIFIED 2026-10-13 against the deployed store, and the two halves of the verify line landed differently.
      LATENCY IS MEASURED AND WITHIN BUDGET: ten of ten questions reranked, slowest 428 ms and average 344 ms against
      a five-second budget, which agrees with the third-of-a-second figure recorded in the architecture for a fifty-
      candidate pool. THE QUALITY HALF IS AT CEILING AND THEREFORE SHOWS NO MOVEMENT: retrieval and support were
      already 100 percent without the reranker on this question set, so there is nothing for it to improve and the
      comparison reports +0 percent. THE EVIDENCE THAT IT WORKS IS IN THE RANKS RATHER THAN THE RATES. Q07 moved from
      rank 10 to rank 1, which is the case the requirement is about: a passage the fusion barely kept inside the
      window became the top passage, and at rank 10 it was one place from being dropped. Q01 and Q06 each moved from
      rank 1 to rank 2, so the reranker also demotes. A ten-question set cannot resolve a reranker's benefit when both
      rates are already at their maximum, and the client's sixty questions in C8 under QLT-GOLDEN-001 are where the
      second half becomes measurable. Recorded as a ceiling rather than as a pass, because reporting +0 percent as
      though it were evidence of no benefit is the same mistake this phase has spent its time removing. BLOCKED AND
      THEN UNBLOCKED: the model needed a paid AWS Marketplace subscription at 0.002 dollars per search unit, which is
      one query against up to 100 documents and therefore one unit per question at our depth of 50. Anthony completed
      it. The first attempt failed with a 403 whose body named the missing actions, and the mechanism under test
      REPORTED ITS OWN ABSENCE rather than falling back to the fused order, which is why the cause was findable at
      all.

  - id: RET-EVAL-001
    title: Retrieval changes are measured on a fixed question set, not assumed
    tier: [cloud, office, hosted]
    phase: C2
    verify: the harness reports retrieval and support rates with per-category counts, and two configurations can be compared on the same questions
    note: >-
      C2 decides the embedding model, the fusion and the chunking, and RET-HYBRID-001 already verifies hybrid on with
      the same question off, so a yardstick has to exist before those decisions. A fixture corpus and question set in
      C2; the client's own sixty in C8 under QLT-GOLDEN-001.
    status: verified
    note_verified: >-
      VERIFIED 2026-10-13 against the deployed store. The harness reports retrieval 100 percent (6/6) and support 100
      percent (4/4), with two answerable questions excluded and counted beside the rate because their answers carry no
      figure and support for prose needs entailment. Per-category counts report n/a rather than zero where nothing
      could be measured. THREE FAULTS WERE FOUND BY RUNNING IT AND ALL THREE WERE THE HARNESS. Support required every
      figure in a paragraph to appear in one chunk, so Q06 and Q07 were scored as misses while the retriever had put
      the right table in front of the model. The question set named a publication, irs-p15-2026, where the corpus
      holds company/irs-p15.pdf, and the harness compared the two directly; the corpus validator settled which side
      was wrong by refusing a source that is not a manifest id. And the fallback for an answer with no figure counted
      shared vocabulary and reported 60 percent of it as support, which made two questions grade on numbers that are
      not answers, an exhibit reference and a two-digit value, and the support rate read 100 percent. The figure is
      now stated by whoever writes the question. GROUND TRUTH RECORDED: the unanswerable questions' top scores overlap
      the answerable ones, 0.673 against a weakest answerable 0.621, so no confidence threshold separates them and a
      refusal has to come from somewhere other than the top score. One of four supported answers came from a document
      with no real pages, where the page rule is satisfied trivially and has not been tested. And Q07's figure was
      found at rank 10, the edge of the window.

  - id: RET-HYBRID-001
    title: Hybrid search returns exact identifiers that vector search alone misses
    tier: [cloud, office, hosted]
    phase: C2
    verify: a golden question containing an exact reference retrieves the right passage with the lexical arm on and fails with it off
    status: verified
    note: >-
      Measured before building, and the measurement was wrong twice in ways worth recording. The first version
      used one phrasing per reference and concluded the vector arm misses rare references; two probes then
      disagreed about Pub. 515 because they asked different questions, "What does Pub. 515 cover?" being found
      at rank 7 and "What is in Pub. 515?" not at all. Asking each reference five ways gives the real finding:
      the spread WITHIN one reference is as wide as the spread between them, so what the lexical arm fixes is
      phrasing rather than rarity, and the bare reference -- "Pub. 515" typed on its own, which is the form a
      person uses -- is missed every time. Plain Postgres full-text matched none of the seven phrasings:
      plainto_tsquery ANDs every term of a natural question, and the parser splits Form W-4 into 'w' & '-4'. So
      references are normalised by a shared extractor rather than matched by a text-search configuration, with
      a small alias table closing the Pub./Publication gap. The store is a chunk_index table with a generated
      tsvector for prose and a normalised identifiers array for references, both GIN indexed. Fusion is our own
      reciprocal rank, k=60, tie-broken on chunk id, because the architecture keeps it out of the database for
      determinism. The lexical arm carries the access clause in its own query, since a second copy of every
      document without a filter is the leak step 3.8 closed arriving by a new road, and a test asserts the
      clause rather than the results. VERIFIED 2026-10-13 against the deployed store: chunk_index held 1060
      rows with 435 carrying identifiers, and hybrid on against hybrid off through the real code path found
      Pub. 515, Form W-3SS and Pub. 519 with the lexical arm and missed all three without it, while Form W-4
      and Pub. 15 were found either way as controls. Still open for the same item: the fusion has not been
      measured against a reranker, so whether the fused order beats either arm alone is unproven.
  - id: RET-CITE-001
    title: Every citation is verified against the retrieved set, the page, and entailment
    tier: [cloud, office, hosted]
    phase: C2
    verify: an invented citation index is rejected; an unsupported sentence is marked, not silently kept
    status: verified
    note: >-
      Built 2026-10-13, recorded in docs/runbook.md step 3.11. The mechanical layer only: seven deterministic
      checks with no model and no new dependency, which is the scope the research sets for Layer 0. Fabricated
      citations, page drift, missing quotes, numeric substitution, identifier substitution, superseded sources
      and low-confidence scans. The literal identifier assertion within it is described in the research as the
      cheapest item in the entire architecture and the highest value, and it reuses the step 3.9 extractor, so
      the retrieval arm and the verifier cannot disagree about what counts as the same reference. An answer is
      MARKED rather than dropped, because a reply that reads cleanly and lost the part that was wrong is the
      failure the layer exists to prevent. Three rules keep the false-refusal rate down, since a check that
      refuses correct answers gets turned off: normalisation drops trailing zeros only, supersession fires only
      when EVERY cited passage is superseded, and the confidence gate applies to figures rather than prose.
      TWO BOUNDS, both recorded rather than papered over. Entailment is NOT built, because it is Layer 1 and
      needs a model the reply path does not have until Phase 4, so `supported` means every mechanical check
      passed and is not the same as true. And the confidence gate is document-level rather than page-level,
      because docling-serve does not populate the per-page confidence map this release exposes, so a page whose
      digits were misread cannot be told from one read cleanly; the research names per-page confidence as the
      Wave 4 item to verify. VERIFIED 2026-10-13 against the deployed store, and the first run found the
      failure this step exists for by accident: the probe asked for the standard labour rate, the retriever
      returned the SUPERSEDED 2025 schedule as passage [1] with the current 2026 one at [2], and the verifier
      refused the claim built from [1] with the reason superseded. A real figure from a real document on a real
      page, correct in every literal respect, refused because the document had been replaced, which nothing
      below this layer would have caught. The probe was wrong and the check was right: it assumed the
      top-ranked passage is a good source, which is the same class of mistake as the 3.9 and 3.10 fixtures, and
      it now builds its claim from the first passage a person may rely on. The two halves of the verify line
      were then proved directly: a claim citing [99] against five retrieved passages was rejected as
      citation_not_found, and a claim stating a figure that appears nowhere in the corpus was marked
      number_not_in_source while remaining in the reply. OPEN, and a ranking question rather than a correctness
      one: the superseded document ranked first, so the answer is refused when a good answer was two places
      down. Whether current documents should be boosted is a search-quality change to measure against the
      golden set rather than guess at here.
  - id: RET-INGEST-001
    title: Ingestion is idempotent, so the same bytes are never embedded twice
    tier: [cloud, office, hosted]
    phase: C2
    verify: two consecutive cycles over an unchanged corpus parse nothing and write nothing the second time
    status: verified
    note: >-
      Built 2026-10-12 and verified 2026-10-13, recorded in docs/runbook.md step 3.7. The manifest holds
      the sha256 of each file as ingested, so an unchanged file is skipped without being parsed, and a
      changed file has its old chunks removed before the new ones are written. Removals are reconciled from
      the manifest rather than the filesystem, so a file that was never ingested cannot cause a removal and
      a documents mount that failed to appear cannot empty a client's index. The four decisions each have a
      unit test that fails if it reverts.
      The verification was a second cycle over the four-document corpus, which printed seen 4, new 0,
      changed 0, skipped 4, failed 0, chunks written 0, against a collection of 1059 points that the cycle
      did not change. The run also settled three things the plan had wrong. The synchronous parser endpoint
      caps at 120 seconds and does not abort the work, so every timeout orphaned a parse and three retries
      accumulated over eight hours of CPU; the worker now submits asynchronously and polls. Two of the four
      conversion options were never options of this release. And is_ocr was a constant, decided from a
      provenance field this release does not emit.
      One finding is recorded rather than fixed. is_ocr cannot be decided from the presence of a digital
      text layer, because a document with a text layer can still have been OCR'd. The flag is False for the
      text PDF and True for the HTML contracts, which produce no confidence report at all, so it is coarser
      than the payload contract implies. That joins per-page confidence as the second feature blocked on the
      same wire-format limit. RET-VERSION-001 and RET-DUPE-001 still sit on top of this: chunks carry no
      version column yet, so a superseded document is removed rather than superseded.

  - id: RET-INGEST-002
    title: A manual ingest cannot run beside the scheduled cycle, and a first bulk load cannot saturate the embedding service
    tier: [cloud, hosted, office]
    phase: C2
    verify: >-
      with the service timer armed, drop files into the documents root and trigger ingestion the way the page
      documents; assert exactly one ingest worker exists at any moment, or that the documented trigger is one
      that replaces the loop rather than joining it. Then load a few hundred documents in one go and assert the
      cycle finishes with zero failures. A load that dead-letters documents because two workers shared one
      embedding service fails the row.
    status: open
    note: >-
      Found on 2026-10-16 while loading the group-01 and group-02 corpus. A manual `docker exec ... ingest.py`
      ran beside the fifteen-minute service cycle, both workers loaded one embedding service, TEI answered
      429, and 171 documents failed a pass with some dead-lettered. Recovered with the worker's own
      `--clear-failures` and a single-writer pass at `INGEST_CONCURRENCY=1`. **Two changes are wanted and
      neither is made, by the owner's decision on 2026-10-16:** the pages should say that the manual command
      starts a second worker and name `oi restart ingestion` as the trigger that does not (a restart runs the
      loop's first cycle and stays the only writer), and the default concurrency of four is too high for a
      first bulk load. Recorded here rather than implemented, so it is not lost and not mistaken for done.

  - id: RET-VERSION-001
    title: A superseded document is not cited while its replacement exists
    tier: [cloud, office, hosted]
    phase: C2
    verify: with two versions indexed, the answer cites the current one
    status: verified
    note: >-
      Built 2026-10-13, recorded in docs/runbook.md step 3.10. The design is the research's rather than
      invented here: a version registry with an explicit is_current flag, set at ingest and reviewable by a
      human, with an answer supported only by a non-current document refused with the reason `superseded`.
      Nothing infers which of two documents is current, because a wrong guess is invisible and an unresolved
      flag is not. Every document is current by default, so a corpus that never touches the registry behaves
      exactly as it did before it existed. A superseded passage is MARKED rather than dropped from the
      results: dropping it would answer the question from a different document with no sign that the right one
      existed and had been excluded, which is a wrong answer wearing a correct one's clothes. The refusal
      itself is step 3.11's, and this step carries the fact to it. VERIFIED 2026-10-13 against the deployed
      store: a query over a corpus holding two versions of a fee schedule returned both, the superseded one
      marked current=False and the current one marked current=True, with the superseded document named in the
      result so step 3.11 can refuse on it. The refused answer itself is 3.11's to build.
  - id: RET-DUPE-001
    title: Near-duplicate documents are detected at ingest
    tier: [cloud, office, hosted]
    phase: C2
    verify: the same document under two filenames is flagged rather than indexed twice
    status: verified
    note: >-
      Built 2026-10-13, recorded in docs/runbook.md step 3.10. The signature is the set of chunk ids, which
      are already a hash of each chunk's text, so the lexical index holds what a comparison needs and no new
      table was added for it. The share is over the SMALLER document, because a five-chunk summary of a
      hundred-chunk report is entirely contained in it and an overlap over the larger would read as 5 percent
      while one over the smaller reads as 100, and neither is "these are the same document". A pair is
      recorded and never acted on: deleting the second copy loses a document a client put there deliberately,
      and keeping both silently means an answer cites whichever the retriever happened to rank first. The pair
      is stored ordered with a unique constraint so it is recorded once whichever document arrived second, and
      a floor of 500 shared characters keeps two small documents that happen to agree from being flagged. The
      note originally said five chunks, which is about 2,500 characters and far too blunt to catch the
      near-duplicates this is about; the code and the runbook both use 500 characters. Status
      VERIFIED 2026-10-13 against the deployed store. A byte-identical copy of a fee schedule under a third
      name was flagged at 100 percent shared, alongside the 90 percent pair formed by the two versions of the
      same schedule, which is the detector working as intended: a new version of a document IS a near-duplicate
      of the old one, so one flag surfaces both the duplicate case and the version case and a person resolves
      each by declaring which is current. Three faults were found by running it and none by reading it: the
      comparison used chunk ids, which contain the document they belong to and so can never match two copies of
      a file; the chunk-count floor suppressed single-page documents, which are exactly what a small business
      duplicates; and detection ran only when a file arrived, so a corpus that predates the check was never
      examined at all -- which is why the first two produced no visible symptom. There is now a
      --scan-duplicates command for that case, and the floor is measured in characters of identical text.
  - id: RET-FORMAT-002
    title: Every suffix the worker accepts is a format the parser actually reads
    tier: [cloud, office, hosted]
    phase: C2
    verify: >-
      a file of each accepted suffix is ingested and answerable, AND for every format the parser
      advertises in its own FormatToExtensions, the pipeline either accepts it or names it as
      excluded with a reason and how that was decided. Measured by
      `bash scripts/check_parser_formats.sh`, which asks the deployed parser what it reads and
      fails on any format nobody has decided
    status: verified
    note: >-
      VERIFIED 2026-10-13 against the deployed store, BY FINDING A FORMAT THAT FAILED IT. `.rtf` is in the worker's
      accepted-suffix set and was never parsed: Docling reads RTF by converting it through LibreOffice, and the
      parser image did not install it, so every RTF raised "LibreOffice is required to convert a .rtf file to
      .docx". The worker classified that as a permanent failure and dead-lettered the file after two cycles, so a
      SUPPORTED FORMAT WAS SILENTLY NEVER INDEXED and the only evidence was a failure count. Fixed by installing
      libreoffice-writer in the parser image -- one line, no application code, 332 MB -- with the build asserting
      that Docling resolves the binary so an image that cannot parse RTF fails to build rather than dead-lettering.
      Verified end to end: a genuine RTF is indexed and answerable at rank 1, and a deliberately malformed RTF is
      refused. Two things this exposed that are fixed with it: the corpus generator's "RTF" fixture was plain text
      with an .rtf extension (faker-file's provider writes no header and no control words), so the corpus claimed
      15/15 formats covered while containing no valid RTF at all; and the failure reason was recorded in the
      manifest's last_error and never surfaced, which is why a missing system binary and a corrupt client document
      both looked like a one-line count. There is now an ingest --failures command that reads the manifest and
      prints the reason, and clearing the dead-letter latch is documented as required after any parser fix,
      because the latch is keyed on the content hash and otherwise makes a correct fix look like it did not work.
  - id: RET-FORMAT-001
    title: Email, spreadsheets, and slides are ingested
    tier: [cloud, office, hosted]
    phase: C2
    verify: one file of each format is ingested and answerable
    note: >-
      VERIFIED 2026-10-13 against the deployed store. One file of each format is ingested and answerable, each found
      by its own fact, a figure appearing nowhere else in the corpus: email at rank 1, spreadsheet at rank 2, slides
      at rank 1. What the parser does with each was measured rather than assumed. The spreadsheet comes back with zero
      texts and three tables, so its content is table-only and the chunker's table handling is what makes it
      retrievable at all. The deck comes back as seven texts over two slides. The email comes back with its headers
      parsed into the text, which matters because who sent a message and when are facts a business relies on that a
      body-only reader loses, and it is pageless, which the chunker already handled by giving it a nominal page. THE
      BUILD WAS ONE LINE: .eml was missing from ACCEPTED_SUFFIXES, and the other two were accepted and had never been
      exercised because the corpus is public filings and tax publications. .msg is deliberately not added: it is a
      compound binary format rather than RFC 822 and whether the parser reads it is unverified, and adding a suffix to
      that set is a promise that files with it are ingested.
    status: verified

  - id: RET-SILENT-001
    title: A file in the documents folder is either indexed or reported, never silently ignored
    tier: [cloud, office, hosted]
    phase: C2
    verify: >-
      a file whose format the worker does not read appears in the cycle's output with its name, in both the
      human summary and the JSON, and the count reaches the state file the healthcheck reads
    status: verified
    note: >-
      VERIFIED 2026-10-16. An unsupported format used to be dropped inside `discover` with no count, no log
      line and no error: the file was in the client's folder, absent from every search, and nothing anywhere
      said so. For a product whose promise is that a client's documents are searchable that is the worst
      available outcome, because the only way to discover it is to look for something and not find it.
      `discover` now returns what it refused, the cycle prints the count and the first twenty names, and the
      count travels through as_counts() into the run record. Operating-system debris is excluded from the
      count on purpose: a number that includes a shortcut is a number an operator learns to ignore, and the
      number is the point. The test fixtures are .msg, .vsd and .accdb, which are formats a small business
      genuinely holds and this pipeline genuinely does not read.

  - id: RET-HEAD-001
    title: A fact that appears only in a heading is retrievable
    tier: [cloud, office, hosted]
    phase: C2
    verify: >-
      a chunk's text carries the heading path it opened under, so a scanned invoice is retrievable by its own
      invoice number and supplier name, both of which appear only in the line docling labels as the title
    status: verified
    note: >-
      VERIFIED 2026-10-16. `chunker.page_texts` treated an item labelled `title` or `section_header` as
      structure: it appended the text to a `headings` breadcrumb and did not let it become content. The
      breadcrumb travelled into the vector payload's `headings` field, and NEITHER RETRIEVAL ARM READ THAT
      FIELD -- the embedding is of `chunk.text` and the lexical index is of `payload["text"]` -- so every
      heading was preserved exactly where nothing could find it. Measured on a rendered scan of an invoice
      whose title line is `HALLORAN MECHANICAL LTD INVOICE 2026-0417`: the OCR was correct, the payload
      carried the line, and `chunk_index` held zero rows matching either `HALLORAN` or `2026-0417` against
      four matching the amount that happened to sit in the body. The invoice could not be found by its own
      number, and the document was indexed. The general form was worse than the scan: a generated record has
      one title and four section headers out of fourteen text items, and a contract in the corpus has sixty
      section headers out of a hundred and twenty-one, all of them unsearchable.
      THE TABLE PATH ALREADY DID THIS, which is what makes it an inconsistency rather than a choice:
      `serialise_table` prepends the same `" > ".join(headings)` and its docstring records why, citing the
      research that a deterministic prefix plus caption beat generated keywords on page accuracy, 67.38
      against 46.10. Prose never got it. The fix is in `emit()` in `_group_prose`: one prefix per chunk, the
      path in force where the chunk opens, so a chunk that runs past a new section belongs to the section it
      began in. `split_oversized` additionally took a `headings` argument and never read it, which is the
      same defect in miniature, and it is removed rather than left behind.
      `CHUNKER_VERSION` is `chunker-v2` and `PAYLOAD_VERSION` is `payload-v5`, so every document is
      re-derived and re-embedded on the next cycle. Five tests, three of which fail with the prefix removed
      and say which fact stopped being searchable.


