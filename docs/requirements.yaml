  - id: INF-TIMEOUT-001
    title: Timeouts, retries, and queueing are bounded, and throttling degrades rather than hanging
    tier: [cloud, office, hosted]
    phase: C3
    verify: with the provider throttling, requests return a clear degraded answer within the timeout, and it is recorded
    status: verified
    note: >-
      Closed 2026-10-14 on the C3 verification pass: three panel rounds, three reviewers, all three verdicts yes, and every finding fixed and re-tested. Evidence is in docs/review-log.md.
          The verify line is met with a real provider throttle rather than a simulated one. throttle_probe drives
          the request ceiling that Bedrock actually enforces on these models and produced a genuine
          ThrottlingException, and the answer came back HTTP 200 with kind='degraded', reason='throttled',
          attempts=3, threshold='first_token', and the budget block recorded.
          Three sub-claims are each tested rather than assumed: classification is by error TYPE and not by status
          code; a retry happens only before the first token, because a second attempt after a partial answer
          would duplicate text a client has already seen; and every threshold is measured against one wall-clock
          deadline anchored where the client asked, not where routing finished. The panel's executor confirmed
          all three from the source and reproduced the degraded path on the live deployment.

