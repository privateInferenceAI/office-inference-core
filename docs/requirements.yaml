  - id: UI-ASK-001
    title: A question returns an answer that carries its sources, and every shape of failure is legible
    tier: [cloud, hosted, office]
    phase: C4
    verify: asking the question the corpus answers returns an answer with at least one citation and a receipt line naming a document count; a question with no source says so rather than answering from the model's own knowledge; a refusal names what was refused; a degraded answer shows the retrieved passages
    status: verified
    note: >-
      Ten browser tests against the deployed app at 1366x768, and twelve integration tests driving the app's own
      client code against the live API. The receipt line is asserted to name a document count rather than
      accepting "No document was cited", because the first version of that assertion passed on an empty corpus:
      a test whose subject can vanish measures nothing, and two redaction tests did exactly that when the corpus
      was replaced underneath them.
  - id: UI-REDACT-001
    title: A value the egress gate strips never reaches the screen, and the screen says something was removed
    tier: [cloud, hosted]
    phase: C4
    verify: a question that makes the model repeat a reserved identifier shows a redaction marker in the DOM, no raw identifier anywhere in the page, and a notice saying something was replaced
    status: verified
    note: >-
      Asserted on the DOM rather than on the API response, because a redaction that happens in the service and is
      rendered from somewhere else is not a redaction. The question matters and was measured: asking WHAT the
      reference is produced a paraphrase, so nothing reached the redactor and the check passed while measuring
      nothing. The question in the suite pushes the model to repeat the value verbatim, which is the only
      condition under which redaction can be observed. With the weaker question the redaction counts came back
      empty; with this one they come back `{'ssn': 1}`.
  - id: UI-AUDIT-001
    title: An action taken in the interface leaves a row in the chain, findable by the id the answer carried
    tier: [cloud, hosted, office]
    phase: C4
    verify: ask a question in the app, take the request id the answer carries, read the chain for that id, and find the row with the egress verdict on it
    status: verified
    note: >-
      This is the phase's central claim and it is the check the handoff names as the one that gets skipped.
      **It found a real defect while the phase was being built:** the API minted a request id on every call and
      never passed it to the audit tool, so the column was empty on every model call and an answer could not find
      its own row. Every test passed. The probe reports zero rows, which looks exactly like "the row was never
      written", and that is why the probe makes the thing it then looks for.
  - id: UI-SCOPE-001
    title: The activity screen states what it is scoped to, and cannot show a subset as though it were the whole record
    tier: [cloud, hosted]
    phase: C4
    verify: a company-scoped session asking for an executive subject by name gets zero rows and restricted true rather than a partial page; the response names the actors it covered; the screen renders that sentence
    status: verified
    note: >-
      The scoping rule is derived from the permission model rather than invented: a session sees its own rows, and
      another subject's when every root that subject holds is one the reader holds too. Containment rather than
      recognition, so an actor with no session record cannot pass a subset test. Applied inside the query rather
      than after it, which is the argument SEC-ACL-001 already makes about retrieval. Proven able to fail: with
      the containment test removed, three scope tests fail and name the leaking case.
  - id: UI-JOB-001
    title: Work runs as a job with a state, one row per attempt, and a replayable event log
    tier: [cloud, hosted, office]
    phase: C4
    verify: a task runs to a terminal state; every attempt appears whether it worked or not; events are numbered from one and replay from a number; the job and each attempt leave a row; a job belonging to another subject answers 404
    status: verified
    note: >-
      Eight rights against the live deployment. The event log is a table rather than a socket, so a client that
      closed the tab catches up with `?since=` instead of losing what happened. **The probe found a real defect:**
      a successful attempt wrote no row of its own, so a job that worked first time left two rows that both said
      "job" and nothing recording that a step had run. The columns existed, the flags existed, and nobody
      connected them, which is the second time this project has paid for that.
  - id: UI-BOUNDARY-001
    title: The data boundary guards every path to a model, including the ones added after it was built
    tier: [cloud, hosted]
    phase: C4
    verify: against a manifest whose data class may not leave, a request and a job are both refused with a 403 naming the class, and the app is a client of the API alone with no model key or database credential in its environment
    status: verified
    note: >-
      **This is the C3 defect shape a third time, and the first time a probe caught it rather than a person.**
      `/ask` refused with a 403 and `/jobs` answered 200 with a failed job row, so work no lane was permitted to
      do had a record and a cheerful status code. The fix is ordering: the boundary is consulted before the job
      exists. Proven able to fail afterwards, by removing the fix and watching the probe name the endpoint that
      answered. The app's runtime environment holds two variables and no credential of any kind, checked by
      allowlist.
  - id: UI-CONTRACT-001
    title: The app is built against a published contract, and drift between the two repositories fails a check
    tier: [cloud, hosted, office]
    phase: C4
    verify: the service publishes response models for every endpoint it serves; the app's own tests hold its code against that document; a checker compares the copy against the running service and exits non-zero when they differ
    status: verified
    note: >-
      Before this, `/openapi.json` listed three URLs and **no response bodies at all**: every response was an empty
      schema, so a second repository would have been built against the manual's prose. **Found from the app's
      side:** its contract test reported that `Task` was not a component, because `/tasks` returned a bare object
      with no declared model, and the core's own tests were all passing. Nine paths and twenty-two models now, and
      the app's copy is compared against the running service by `check-contract.sh --live`.
  - id: UI-ACCESS-001
    title: The interface is usable with the keyboard alone at the office's screen size
    tier: [cloud, hosted, office]
    phase: C4
    verify: a question is asked with the keyboard alone, focus is visible on the control being used, and nothing scrolls sideways at 1366x768
    status: verified
    note: >-
      Three browser tests at 1366x768, the size the design names. The office is keyboard-first because front desk
      staff type faster than they click, so a control a keyboard user cannot find is a control that does not
      exist for them. The reference instance's screen size was measured rather than assumed: the runbook records
      1366x768 against the actual host.

  - id: SEC-CRED-001
    title: A session credential is never stored, never logged, and never rendered
    tier: [cloud, hosted, office]
    phase: C4
    verify: the credential is a different value from the session identifier; the store holds only its SHA-256; presenting the identifier resolves nothing; a credential-shaped key is stripped from an activity payload at any depth; a job resolves its session by the hash and fails honestly when the session is gone
    status: verified
    note: >-
      **Found by the C4 panel's cold reader, not by a test**, which is the part worth remembering. The reader
      opened an audit row in the app, saw a value in the payload, and asked whether it was a credential. It was:
      the session identifier WAS the credential, because `mint` generated one random string and used it as both.
      Confirmed by taking an id out of a row and authenticating with it: HTTP 200. Because the Activity screen
      widens with permission, **one person's live credential was readable on another person's page**, and the
      rows are append-only and hash-linked so it could not be taken back. Migrations 019 and 020 separate the
      two, store only a hash, revoke the sessions whose credentials are already in the chain, and truncate the
      job rows that held one. The exposure is recorded in docs/review-log.md rather than rewritten, because a
      record that can be edited to hide something is not evidence. The activity view also strips
      credential-shaped keys at any depth, with a test that asserts the view applies it — because the helper's
      own tests passed while the call was removed.
  - id: UI-HONEST-001
    title: What the screen says about an answer matches what the answer did
    tier: [cloud, hosted, office]
    phase: C4
    verify: the receipt counts the documents the answer cited rather than the passages retrieval returned; an answer that declines says the documents do not cover the question even when it cites the passages it rejected; the source list is the cited set; no markup source syntax reaches the screen; a state that could not be read is not reported as an empty one
    status: verified
    note: >-
      Also the cold reader's work, and all of it was invisible to a test of the payload because every payload was
      correct. The receipt printed `citations.length`, which is what retrieval found — six, whatever the
      question — so "Answered from 6 documents on this machine" appeared under "I cannot answer the question
      based on the given passages". The line manual 13i calls the point of the product was describing the
      search. Markdown reached the screen on the streaming path and not the JSON one. An expired session made
      the shell claim the deployment declares no tasks while the same header said all systems ready, so the
      shell has three states now: known, empty, and unreadable.

  # ---- C5: workflows and the first connector ------------------------------------------------
  # Every row here is subject to BIZ-INDEPENDENT-001: nothing may sit on infrastructure we operate.
  # The research behind these is in docs/research/, and the two audit defects C5 is the first writer
  # for are recorded on AUD-APPROVAL-001.

  - id: WF-ENGINE-001
    title: A workflow runs more than one step, and every step is written to the audit chain in the same transaction as the state change
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      run the invoice workflow end to end; the job carries more than one step; the audit chain has a row per
      step naming the job id; and verify_chain passes afterwards. The transactional half is tested by killing
      the process between the state write and the audit write: either both are present or neither is, and a
      step that changed state with no chain row fails the test.
    status: verified
    note: >-
      Verified 2026-10-16, `docs/runbook.md` step 6.1. The engine runs a six-step invoice plan and every step
      leaves a chain row naming the job id. The transactional half is proved twice: `workflow_probe.py`'s
      ATOMIC right SIGKILLs a child process between the state write and the chain write and then reads
      Postgres (job `queued`, 0 step rows, 0 chain rows), and
      `test_workflow_chain.py::test_a_chain_write_that_fails_rolls_back_the_state_change_with_it` does it
      with an exception. This row was not achievable before the build: `cmd_record` opened its own
      connection, so the audit row was always a separate transaction. `services/audit/audit.py` now has
      `insert_event(cur, ...)`.
      Same-transaction is the reason the engine is ours rather than adopted. Every off-the-shelf engine sits
      outside our transaction and reports by webhook, so a crash between the business write and the audit write
      leaves a gap in the artifact a client may ask to verify.

  - id: WF-RESUME-001
    title: A workflow paused for approval survives a restart of the service
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      stop a job at awaiting_approval, restart the service, approve it, and the job completes. The steps after
      the gate each have exactly one row, so a resumed run does not repeat work it already did.
    status: verified
    note: >-
      Verified 2026-10-16, `docs/runbook.md` step 6.2, **at the service level**. `POST /jobs` started
      `invoice_intake` over HTTP and it stopped at the gate; `docker restart api` ran while it waited and the
      job came back `awaiting_approval` with its digest intact; `POST /jobs/{id}/approvals` then finished it:
      `succeeded`, six steps, each exactly one row, and the chain verifies (176 events, intact). Two engine-
      level probes cover the same property without a service: the probe's `RESUMED` right closes the
      connection and reloads in a second one, and `test_workflow_chain.py` counts one row per post-gate step.
      `pending_action_digest` was on the dataclass and in neither the INSERT nor the SELECT, so every approval
      after a restart would have been refused as drift; migration 021 adds the column. **Getting here took
      four fixes to paths that had never run** — the decision written into the constrained `outcome` column,
      the approvals route shadowed by `/jobs/{job_id}/{action}`, `PostgresStore.get()` returning no steps, and
      a stale `outcome_reason` on a succeeded job. None of the four was visible to a green suite.

  - id: WF-FAIL-001
    title: A failed step is recorded with its cause and the workflow does not continue past it
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      force a step to fail by stopping a service it needs; the job reaches failed, the failing step carries a
      typed cause rather than a string, and no later step has a row. A test that asserts only the failure and
      not the absence of later steps passes on a workflow that ran to the end and failed at the last hurdle.
    status: verified
    note: >-
      Verified 2026-10-16, `docs/runbook.md` step 6.3. The probe's TYPED right reports `unreadable_invoice`
      on the failing step and **zero rows for the step after it**, which is the assertion the row asks for
      rather than the failure alone.

  - id: WF-TIMEOUT-001
    title: A step that hangs is stopped, rather than hanging the job indefinitely
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      point a step at an endpoint that accepts a connection and never answers; the step fails on its timeout
      with the timeout named, and the job reaches a terminal state within a bounded time.
    status: verified
    note: >-
      Verified 2026-10-16, `docs/runbook.md` step 6.3. The probe points a step at a listening socket that
      accepts and never answers; the step ignores its own deadline, and the engine stops waiting at 0.5s,
      fails the step with `step_timeout` and leaves no row for the step after it. BOUNDED reports the elapsed
      time (0.52s).

  - id: WF-CANCEL-001
    title: A person can stop a running workflow, and the stop is recorded with who asked
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      cancel a running job; the state becomes cancelled, no further steps run, and the record names the session
      that asked. A cancel that leaves a step running is a failure even though the state says cancelled.
    status: verified
    note: >-
      Verified 2026-10-16, `docs/runbook.md` step 6.3. The probe cancels a running job from another thread;
      the job is `cancelled`, no later step has a row, and the in-flight step is closed as
      `failed/cancelled_mid_step` rather than left saying `running`. The session that asked is on the route's
      own audit row; that path is the API's.

  - id: WF-IDEMPOTENT-001
    title: Retrying a step does not repeat an effect it already had
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      fail a step after its side effect but before its state write, then let it retry; the effect happens once.
      The test counts the effect, not the attempts.
    status: verified
    note: >-
      Verified 2026-10-16, `docs/runbook.md` step 6.3. The probe fails a step **after** its external effect
      and before its state write, then lets it retry: the far side applied the effect once over two calls,
      and the ledger has one row. The engine's key is `sha256(job_id|step_name)`, so it does not move between
      attempts; a key derived from the attempt would have applied it twice with the job still reporting
      success.

  - id: CON-OWNED-001
    title: Every component of intake lives in the client's estate, and intake keeps working when we are gone
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      the address is one the client already uses; the mailbox is licensed and in their tenant; the application
      registration is in their identity tenant; the consent grant is theirs; the credential is in their secret
      store. Cut every cord to Office Inference and intake still works. The test fails if any of those five
      lives with us.
    note_verified: >-
      The five components are asserted to be the client's by a check that prints which estate each lives in, and by five negative controls that move each one to us in turn and watch the check fail. The rule and the check are real; no client tenant exists yet, so this is proved against a stand-in. Tenant is a fixture implementing the documented delegated semantics, not Microsoft.
    status: verified
    note: >-
      A shared mailbox cannot be used and this is the finding that shaped the design: Microsoft keeps sign-in
      blocked on shared mailboxes with a system-generated password, and delegated OAuth needs one interactive
      sign-in. A shared mailbox therefore forces application permissions, which is where Graph Mail.Read reads
      every mailbox in the tenant. The client needs a licensed regular mailbox, and that belongs in the
      onboarding checklist because it is a purchase.

  - id: CON-LEAST-001
    title: The mail credential reads one mailbox and can reach nothing else in the client's tenant
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      enumerate what the credential can reach and assert it is one mailbox. The path taken is delegated
      permission on a licensed mailbox, which is scoped by construction; an application permission with an
      RBAC scope is refused, because that scope is additive and Microsoft's own guidance says a leftover Entra
      grant makes it a no-op, so an administrator who completes three of four steps builds something that
      looks scoped and is not.
    note_verified: >-
      The enumeration runs six probes and exactly one reaches anything, and the same enumeration against a tenant-wide credential reports the second mailbox as reached, which is what makes the one-mailbox result evidence rather than an absence. Delegated Mail.Read is scoped to one mailbox by Microsoft's documented contract; not yet observed on a real tenant.
    status: verified

  - id: CON-INTAKE-001
    title: Every document taken in is recorded with its source, its arrival time and its content hash
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      put a document into intake; a row exists naming the sender, the message identifier, the arrival time and
      the sha256 of the content; the same hash appears on the ingest manifest row. An intake that records the
      file but not where it came from cannot answer an auditor asking what arrived.
    note_verified: >-
      The recorded sha256 equals ingest.sha256_of on the deposited file, the relpath sits under the worker's root, and no .part is left behind. Matched against the ingestion worker's own function rather than a second implementation of the same hash.
    status: verified

  - id: CON-DUPE-001
    title: The same document arriving twice does not run the workflow twice
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      deliver the same invoice twice, once as a re-send and once as a forward; the second is recognised by
      content hash, no second job is created, and the duplicate is recorded as a duplicate rather than
      discarded silently.
    note_verified: >-
      The same bytes as a re-send and as a forward: one deposited, one recorded as duplicate naming the first, one copy on disk, no second outbox notice.
    status: verified

  - id: CON-INJECT-001
    title: Content arriving through intake cannot make the system act on instructions inside it
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      deliver an invoice whose body contains an instruction, such as a line telling the system to email a list
      to an outside address; the workflow's actions are unchanged and the attempt is visible in the record. The
      test asserts the action did not happen, not merely that a guard exists.
    note_verified: >-
      The instruction is flagged by name, zero non-GET requests reach the mail API, the action list is empty, and the instruction text is absent from the row. A supplier footer reading 'if your bank details have changed' is the false-positive control.
    status: verified
    note: >-
      Invoice fraud is a live surface rather than a hypothetical: AFP's 2025 survey found 79 percent of
      organisations saw payment fraud attempts and invoice fraud almost doubled to 24 percent, and the FBI
      logged 21,442 business email compromise complaints in 2024. Every commercial comparator we surveyed
      hardened intake with sender verification or per-account addressing, and all four pair it with a human
      review step. The approval gate is what makes this survivable, which is why intake and approval are one
      phase rather than two.

  - id: CON-SENDER-001
    title: An invoice whose sender cannot be verified is marked rather than trusted
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      deliver an invoice from an address that is not a known supplier, and one whose envelope sender differs
      from its header sender; both are marked and neither is approved automatically. SPF, DKIM and DMARC
      results are recorded with the message.
    note_verified: >-
      A known supplier is trusted, an unknown sender and an envelope that differs from the header are both marked, DMARC is recorded, and review is required in every case.
    status: verified

  - id: CON-FOLDER-001
    title: The folder connector polls, because inotify does not see a network filesystem
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      write a file into the watched share from a second machine and assert it is picked up without a restart.
      A test that writes locally and watches a local path passes on a connector that would miss every real
      arrival, because inotify's own man page says it does not catch remote events on network filesystems.
    note_verified: >-
      The connector runs as a subprocess and a second process copies a file in with copy2; pickup happens without a restart and /proc/<pid>/fd shows zero inotify descriptors throughout, which is the assertion a local write-and-watch test cannot make.
    status: verified

  - id: CON-SILENT-001
    title: Intake detects a break that leaves a working credential and an empty queue
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      simulate each silent failure, which is a revoked scope, a pulled licence and a mail rule diverting
      invoices; in every case the credential still works and the queue empties, so error logging reports
      nothing. A heartbeat plus a volume floor catches all three. The alerts route to an address the client
      controls, because an alert to us reintroduces the dependency the design exists to remove.
    note_verified: >-
      Three scenarios in one test. A revoked scope and a diverting rule both leave last_error None, so error logging reports nothing, and the volume floor catches both; a pulled licence is caught precisely and by the floor. Alerts name the client's recipient, and one on our domain is refused. The recipient rule is what stops monitoring reintroducing the dependency the design removes.
    status: verified

  - id: APR-STATE-001
    title: A job stops at awaiting_approval and stays there until a person decides
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      run a job to its gate and leave it; it is still awaiting_approval after a wait longer than any step
      timeout, it has not proceeded and it has not failed. A gate that quietly expires into a failure is worse
      than one that waits, because the work is lost and nobody was asked.
    status: open

  - id: APR-DECIDE-001
    title: Approve, deny and request-changes are each recorded, and a denial carries a reason
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      three jobs, one per decision; each record names the decision and the session that made it; the denied one
      carries a reason, and a denial submitted without one is refused rather than stored blank.
    status: open

  - id: APR-RESUME-001
    title: An approval resumes the job where it stopped, and a denial stops it without running the rest
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      approve a paused job and assert the steps after the gate run exactly once while the steps before it do
      not run again; deny a second job and assert no step after the gate runs at all.
    status: open

  - id: APR-HONEST-001
    title: An approval record does not claim a verified identity the system cannot verify
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      every approval row carries an identity basis, and no row records a verified identity while that basis is
      a session token. The test fails if the field is absent, and it fails on any sentence in the API, the UI
      or the activity feed that names a person or asserts that a person acted.
    status: open
    note: >-
      21 CFR 11.100(b) makes identity verification a precondition to an electronic signature existing, and the
      FDA's 2003 enforcement discretion kept the signature rules when it relaxed everything else, so this is
      the one corner of Part 11 that was never softened. Section 11.50 wants a printed name, a timestamp and
      the meaning, and C5 can establish two of three honestly. No wording fixes the third. Two defects are
      live here and C5 is the first writer for both: audit_events.approval is outside the hash chain, the
      identical defect migration 013 fixed for the redaction columns, so the record goes in payload instead;
      and audit_feed renders an approval as 'a person ' || outcome || ' an action', which asserts something
      the system does not know.

  - id: APR-IRREVERSIBLE-001
    title: Nothing irreversible happens before an approval
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      a workflow whose final step sends an email stops at the gate; assert nothing was sent, then approve and
      assert it was sent exactly once. The test asserts the absence before approval, because a test that only
      checks the send afterwards passes on a system that sends twice.
    status: open

  - id: APR-UPGRADE-001
    title: Approval records can be re-attested when real identity arrives, without rewriting the chain
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      take an approval recorded before identity existed, append a re-attestation naming the account that held
      the session, and assert the original row is byte-identical, the new row links to both its id and its
      row_hash, and verify_chain still passes. Migration 013 is the template: version the formula, never
      recompute old rows.
    status: open
    note: >-
      The limit is worth stating rather than discovering. Assurance cannot be upgraded retroactively: the C5
      token is a bearer credential and the workstation is often shared, so a later statement by a named person
      is a new claim rather than evidence about the original act. Every C5-era approval is unverified
      permanently, plus one appended statement about which account held the session. The purpose of the C7
      work is to make that boundary visible and dated, not to make old approvals verified.

  - id: UI-REVIEW-001
    title: The queue shows what will happen, why, and the exact content, before a decision is offered
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      a pending approval for a drafted email shows the recipient, the subject and the full body, and the reason
      it was drafted. A browser test asserts the body is present in the document before the approve control is
      enabled, so a screen that offers approval before showing the content fails.
    status: verified
    note: >-
      Verified 2026-10-16 in oic-ui. tests/review.test.tsx records the document at every mutation and asserts the
      earliest frame containing an enabled Approve control already carries the recipient, the subject and the full
      body, so the ordering claim is checked rather than the end state. It also asserts a record carrying only a
      digest offers no decision at all. e2e/review.spec.ts asserts the same in a browser.

  - id: UI-REVIEW-002
    title: Approve, deny and ask-for-changes are all reachable and their result is visible
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      three browser tests, one per control, each asserting the job leaves awaiting_approval and the screen
      reflects the decision without a manual refresh.
    status: verified
    note: >-
      Verified 2026-10-16 in oic-ui. Three browser tests in e2e/review.spec.ts, one per control, each asserting
      the request carries the decision and the digest it quotes, the job leaves awaiting_approval, and the queue
      reflects it with no manual refresh. tests/review.test.tsx covers the same three and adds the 409
      approval_drift branch, which re-reads and asks again rather than reporting a generic failure.

  - id: UI-REVIEW-003
    title: Bulk approval exists only for items the system can show are identical, and it states the count
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      five identical approvals offer one action naming five; a queue of five different items offers none. The
      test asserts the absence on the mixed queue, which is the half that matters.
    status: verified
    note: >-
      Verified 2026-10-16 in oic-ui. e2e/review.spec.ts offers one control naming five when five items hold the
      same digest and states the rule, and asserts the ABSENCE of any batch control and of the word identical on a
      queue of five different digests. tests/review.test.tsx asserts both halves and adds the case of equal
      digests with no readable content, which offers none.
      The evidence says assume rubber-stamping: Graphite's data on merged pull requests found 46 percent
      approved with no comment at all and 65 percent with three words or fewer, and that is engineers
      reviewing peers. Bulk approval is therefore a stated rule with a count rather than a checkbox column,
      and it is refused unless the items are genuinely identical.

  - id: UI-REVIEW-004
    title: An empty queue says so, rather than looking broken
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      a browser test on a deployment with no approvals asserts a sentence explaining that nothing is waiting,
      not a blank panel and not a spinner that never stops. Review was deliberately left out of C4 for this
      reason, so the screen that finally ships must not repeat the fault.
    status: verified
    note: >-
      Verified 2026-10-16 in oic-ui. e2e/review.spec.ts and tests/review.test.tsx assert the sentence 'Nothing is
      waiting for a decision.' on an empty queue, that the reading state has gone, and that no spinner element
      exists. The unreadable case renders separately, because a job that cannot be read back is not the same fact
      as a job that is not waiting.

  - id: UI-LIVE-001
    title: A running job shows its steps as they happen, in a sentence rather than a step identifier
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      start a multi-step job and assert each step's line appears while the job is still running, and that the
      line is a sentence a non-technical reader understands. Two levels of disclosure and no more, because
      beyond two users get lost.
    status: verified
    note: >-
      Verified 2026-10-16 in oic-ui. tests/jobSentences.test.ts asserts a step name becomes a sentence with no
      underscore, no bare generated identifier, a leading capital and an end mark, across the names a workflow
      actually uses. tests/live.test.tsx asserts the line appears while the job is running, and e2e/live.spec.ts
      asserts two levels and no more with the second closed by default and the stop control at level one.
      The most useful practitioner evidence is LukeW's February 2026 account of shipping agentic interfaces:
      his team built deep progressive disclosure, pulled back, and concluded the agent's work should serve as
      the progress indicator rather than sitting beside a spinner. One finding cuts against instinct: a CHI 26
      study of 240 participants found a 2 second time-to-first-token rated LESS thoughtful and LESS useful
      than 9 or 20 seconds, so speed is not unambiguously good in an interface that is supposed to look
      considered. Skeleton screens are not cited as evidence for anything, because the study behind the common
      advice found no significant difference.

  - id: UI-LIVE-002
    title: The live view survives a refresh and reconstructs itself from the recorded events
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      refresh the browser mid-run; the view returns to the same job with the steps already recorded, none
      missing and none invented. Render the complete screen from the job first and derive the stream cursor
      from it, so the connection is never the only copy of progress.
    status: verified
    note: >-
      Verified 2026-10-16 in oic-ui. e2e/live.spec.ts reloads the browser mid-run and asserts the steps already
      recorded come back, none missing and none invented. tests/live.test.tsx captures the DOM at the instant the
      EventSource is constructed and asserts the complete screen was already drawn, that the cursor came from
      events_through, and that a replayed frame is not shown twice.

  - id: UI-LIVE-003
    title: A job that has stopped progressing looks stalled rather than working
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      freeze the worker mid-job; the view stops claiming progress within the staleness window and says the job
      has not reported since a stated time. A heartbeat does not solve this on its own, because a keep-alive
      comment is invisible to a reader by design, so only a real event changes what the screen says.
    status: verified
    note: >-
      Verified 2026-10-16 in oic-ui. e2e/live.spec.ts waits out the real 45 second window and asserts 'No progress
      reported.' with the time the job last reported; the window is not shortened for the test.
      tests/live.test.tsx asserts the same over a short window and that a real event clears the line. The route's
      keep-alive is a comment line that never reaches the component, so it cannot reset the clock.

  - id: UI-FEED-001
    title: No sentence in the interface asserts something the record does not know
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      read every string the activity feed and the review screen can produce for an approval, and fail any that
      names a person or asserts that a person acted while the identity basis is unverified. The existing feed
      line fails this test today, which is the point of writing it.
    status: verified
    note: >-
      Fixed 2026-10-16 in migration 022, which replaces `audit_feed`'s approval branch. It read `'a person '
      || outcome || ' an action'`, which asserts a person the system has not identified; it now renders from
      `payload -> approval -> identity` and falls back to the unverified sentence for any value it does not
      recognise. `test_workflow_chain.py` compares the view's sentence against `approvals.describe()` for all
      three decisions, which is what stops the SQL and the Python drifting. **The design document's suggested
      expression reads `payload -> identity`, which is null for every row; that path would have taken the
      honest branch for verified approvals too, invisibly.**

  - id: AUD-APPROVAL-001
    title: No audit column carrying meaning sits outside the hash chain
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      for every column on audit_events that a reader would treat as a fact, assert it is either inside the
      canonical string or hashed into payload_sha256. audit_events.approval fails this today: it is a jsonb
      column with an approval event type and it is not among the eighteen fields the canonical function takes,
      so a value written there can be edited by hand while every chain check passes.
    status: open
    note: >-
      This is the identical defect migration 013 was written to close for the four redaction columns, and its
      comment states the consequence better than a new sentence could: a field the chain does not cover is a
      field that can be rewritten while every check passes, and the check would report the record intact.
      Nothing writes an approval row yet, so C5 is the first writer and the choice is still open. The
      recommendation is payload, which payload_sha256 already covers, so no schema change and no new chain
      version is needed.
      The defect was found on 2026-10-16, before any writer existed.

  - id: AUD-WF-001
    title: Every workflow step, tool call and approval is addressable by the job that caused it
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      run a full workflow, then ask the chain what the job did and assert every step, every tool call and the
      approval come back. A step that ran with no chain row fails, and so does a chain row that cannot be
      traced to a job.
    status: verified
    note: >-
      Verified 2026-10-16, `docs/runbook.md` step 6.1. After a full run the probe counts 13 chain rows naming
      the job and 6 distinct steps, and no step row exists without one. The approval decision's own row is
      written by the route, not the engine.

  - id: AUD-WF-002
    title: The chain verifies after a full workflow run, including a resumed and a denied one
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      verify_chain passes after a completed run, a run resumed from approval, and a run denied at the gate. The
      three paths are tested separately because a resume re-enters the same code in a different state.
    status: verified
    note: >-
      Verified 2026-10-16, `docs/runbook.md` step 6.2. The probe exports the day and verifies it after a
      completed run, a run resumed from approval and a run denied at the gate: `chain intact`. The three
      paths are exercised as separate rights in one probe run.

  - id: SEC-APR-001
    title: An approval cannot be issued by a caller who supplies their own role
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      submit an approval carrying an executive role in the body with no valid session; the request is refused
      and the attempt is recorded. This is the guard C3 paid for and it applies to the approval route exactly
      as it applies to a question.
    status: open

  - id: SEC-CON-001
    title: The intake credential is not readable from the application container or the repository
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      inspect the image and the container environment for the credential and find none; attempt to read it
      from inside the application container and fail; scan the repository and find no key. The credential is
      read from the client's secret store at the point of use, and a rotation by the client's administrator
      takes effect without a redeploy.
    note_verified: >-
      No key in the service, mode 0644 refused, rotation taking effect on the next poll with no restart and asserted on what the token endpoint was presented, the value never in the record, and the api container declaring no access.
    status: verified

  - id: SEC-INTAKE-002
    title: Intake cannot be used to reach anything beyond the mailbox it reads
    tier: [cloud, hosted, office]
    phase: C5
    verify: >-
      attempt to use the intake credential against a second mailbox, a different service and the directory;
      every attempt is refused. The test enumerates what the credential can reach rather than asserting the
      permission it was granted, because the two differ when a scope is additive.
    note_verified: >-
      A second mailbox, the directory, a profile and another service all answer 403, and a write method is refused in code before it is sent.
    status: verified

  # ---- C6: the agent runtime and the MCP gateway --------------------------------------------
  # The design is docs/decisions/0002-agent-topology.md, written 2026-10-09 and never naming C6: one
  # runtime per deployment, no swarms (NEVER-SWARM-001), sub-agents with hierarchical ownership, and
  # two modes. C6 replaces the plan, not the engine, so the transaction, the gate, the event log and
  # the approval route are C5's and are reused rather than rebuilt.
  # Every row is subject to BIZ-INDEPENDENT-001 unless its note says otherwise. The exit criterion is
  # an agent task with a sub-agent and a human checkpoint, from build-plan.md and build-brief.md.
  # The gateway is chosen and not yet deployed. ContextForge is named in build-plan.md and
  # build-brief.md; nothing has run it, measured it or put a connector behind it. Every MCP- row below
  # will therefore be proved against a stand-in connector unless a real one exists in the client's
  # estate, and that limit belongs on the rows rather than in a reader's assumption.

  - id: AG-LOOP-001
    title: An agent task runs a loop of steps, each of which may call tools, and every step is a row in the record
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      run an agent definition that needs at least three tool calls; the task has one job row, a step row
      per step, and a chain row naming the task id for every step and every tool call, and verify_chain
      passes afterwards. A tool call with no step row, or a step row with no chain row, fails. The run is
      bounded by the job's existing time and attempt budgets rather than by the model deciding to stop.
    status: open
    note: >-
      The loop is the one thing a workflow plan cannot express, and it is the only part of the engine C6
      replaces. The unit of work is C5's: the state change, the event and the chain row in one
      transaction, so a kill between them leaves neither present.

  - id: AG-CHECKPOINT-001
    title: A task run survives a restart mid-task and resumes from its last recorded step
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      kill the runtime between two steps of an agent task; restart it; the run continues from the first
      step without a succeeded row, no step that already ran runs again, and the record shows the resume.
      A run that starts its work over, and a resume with no checkpoint row, both fail.
    status: open
    note: >-
      C5's engine derives position from the succeeded step rows rather than a cursor column, and C6
      inherits that. The row exists because "it resumed" and "it started over and nobody noticed" look
      identical from outside the record.

  - id: AG-MODES-001
    title: Conversational mode and task mode are separate budgets, and a conversational turn cannot become a long run
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      a conversational turn returns inside the conversational deadline and offers no approval gate; a task
      run may exceed that deadline and stops at a gate. A conversational request that produces a task-mode
      run, and a task run that inherits the conversational deadline, both fail.
    status: open
    note: >-
      0002-agent-topology.md: two modes inside one runtime, with different prompts, timeouts and model
      roles. The interface already has the two verbs, Ask and Do, so this row is what keeps a slow task
      from being refused as a slow question and a question from holding a task's budget.

  - id: AG-RUNTIME-001
    title: One agent runtime per deployment, holding the sessions, the tool policy and the audit path
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      the deployment runs one runtime service; every definition's runs land in one job store, one event log
      and one policy document; and a manifest that declares a second runtime is refused by validation
      rather than deployed. The test fails if two processes can both claim a task, or if a definition's
      runs appear in a second store.
    status: open
    note: >-
      0002: exactly one runtime, because a second one means a second audit path, a second policy and two
      places for a bug to hide. What varies per deployment is definitions (0 to 6) and concurrent runs
      (1 to 5), not runtimes.

  - id: AG-QUEUE-001
    title: Several definitions run at once inside one runtime, and concurrency is a queue setting
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      start more runs than the configured concurrency; the extra runs wait in queued rather than being
      refused or run past the limit, every accepted run has a job row from the moment it is accepted, and
      its position is readable. A run that is accepted and then lost, and a runtime that ignores the
      limit, both fail.
    status: open
    note: >-
      0002's third reason for one runtime: concurrency is a queue setting, not another service. The job
      state machine already has queued, so this row is what stops a busy deployment from becoming a second
      deployment.

  - id: AG-CONTEXT-001
    title: A long run's context stays inside the model's window, and what left it is recorded
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      run a task whose tool results exceed the model's window; the prompt stays under the configured
      ceiling, the run completes, and the chain says what was summarised or dropped and when. A run that
      truncates without recording it fails.
    status: open
    note: >-
      Item 3 of 0002's list of what a long job needs. The record matters because the first question after a
      wrong answer is whether the model saw the material, and a silent truncation is indistinguishable
      from a model that ignored it.

  - id: AG-VERIFY-001
    title: A run establishes that it worked before it reports success
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      an agent definition whose last step checks the run's own outcome; a run whose check fails ends failed
      with a typed cause, and the step after the check has no row. A run that reports success because the
      model described the work it intended to do fails the row.
    status: open
    note: >-
      Item 4 of 0002's list. The failure this rules out is the confident summary, which reads exactly like a
      completed task in every screen and every record field except the one that says it failed.

  - id: AG-CHILD-READS-001
    title: No sub-agent performs a side effect; every action belongs to the parent
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      give a child a brief whose only completion path is a tool with a side effect; the tool is refused for
      the child or absent from its scope, the parent performs the action after the child returns, and no
      chain row records a side effect against a child span. The test asserts the absence at the child,
      because a system where both can act passes a test that only checks the parent acted.
    status: open
    note: >-
      Rule 1 of six in 0002, and the load-bearing one: children read, parents act, so approvals and
      irreversibility have exactly one owner. A child that can send an email makes the approval gate
      advisory, because the gate cannot see inside a child's run.

  - id: AG-CHILD-RETURN-001
    title: A sub-agent returns facts with citations rather than prose
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      a child's return is a structured record whose facts each name the source they came from, and the
      parent's later step cites one of them; a child returning free text with no sources fails. The parent's
      action names the return it used.
    status: open
    note: >-
      Rule 3 of six. It is also what keeps the parent's context bounded, which is the reason sub-agents
      exist: a parent that has to re-read a transcript has paid for the child twice.

  - id: AG-CHILD-BUDGET-001
    title: A sub-agent has its own budget, and overspending it stops the child rather than the deployment
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      give a child a token budget and a wall-clock budget; a child that exceeds either is stopped with a
      typed cause, the parent continues or fails by its own rule, and the record carries the child's spend.
      A child's spend that does not appear in the parent's total fails, because an untraceable bill is the
      failure this row exists for.
    status: open
    note: >-
      Rule 4 of six. Child spend counts against the deployment's budgets. A sub-agent that costs nothing to
      start is a sub-agent that gets used instead of a cheaper search.

  - id: AG-CHILD-DEPTH-001
    title: Depth is one; a sub-agent cannot spawn a sub-agent
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      a child that attempts to spawn a grandchild is refused with a cause naming the depth limit, and the
      attempt is recorded. The test fails if a third-level span exists anywhere in the record.
    status: open
    note: >-
      Rule 5 of six, and the line between sub-agents and the swarms NEVER-SWARM-001 rules out. A tree of
      unknown depth is where "what did the system do" stops having an answer a person can follow.

  - id: AG-GATE-001
    title: A tool call with an irreversible effect stops for approval, quoting the exact call it is about
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      an agent task whose step would send an email or post an entry stops at awaiting_approval with a digest
      over the exact tool call, meaning the tool name and its arguments; assert nothing was sent, approve
      quoting the digest, and assert it was applied exactly once; then change one argument and assert the
      decision is refused with 409 approval_drift. The test asserts the absence before approval, because a
      test that only checks the send afterwards passes on a system that sends twice.
    status: open
    note: >-
      APR-IRREVERSIBLE-001 extended from workflow steps to tool calls, and it reuses C5's gate rather than
      adding a second one: same digest, same route, same record. A tool call can do damage a workflow step
      never could, which is why the gate is the point of the phase rather than a feature of it.

  - id: AG-SEAM-001
    title: An agent task is a job, using the same store, event log, approval route and pause, resume and cancel actions
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      start an agent task, pause it, resume it and cancel it through the C5 routes; each action leaves the
      same rows a workflow leaves, and a decision on its gate goes through POST /jobs/{job_id}/approvals
      with no agent-specific route. A second state machine, a second approvals path or a second event log
      fails the row.
    status: open
    note: >-
      Manual 13i says pause, resume and cancel are the seam C6's multi-step executor plugs into, and manual
      13m says C6 replaces the plan and not the engine. The row is here so the seam is used rather than
      re-implemented, which is the cheaper mistake to make at the start of a phase.

  - id: AG-DEFS-001
    title: Agent definitions come from the packs the client bought, and an undeclared task is refused by name
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      a deployment with no agentic pack exposes no definitions and POST /jobs refuses the task by name; a
      deployment with the pack lists each definition with the role that answers it and the tools it may use.
      A task that runs without a declared definition fails.
    status: open
    note: >-
      0002 gives 0 to 6 definitions depending on the pack, so an office build with Document Chat and
      Workflows has one runtime with nothing to run. That is the correct outcome, and the refusal is what
      makes it visible rather than a menu of things that cannot work.

  - id: MCP-REGISTRY-001
    title: Tools are declared per deployment, and an undeclared tool is refused by name
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      call a tool the deployment does not declare; the refusal names the tool and says it is not declared
      for this deployment, the refusal is recorded, and the connector sees no request. The set the registry
      reports and the set the manifest declares are equal, and a tool present in one and absent from the
      other fails.
    status: open
    note: >-
      Silently unavailable is the failure this rules out. A model that cannot see a tool answers from memory
      instead, and nothing in the run says so.

  - id: MCP-CREDS-001
    title: Each connector has its own credential, held in the client's store and absent from the image, the environment and the record
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      rotate one connector's credential; the next call uses the new value with no redeploy, the old value
      fails, neither value appears in the record or in a container environment, and a store file another
      account can read is refused. The same shape as SEC-CON-001, per connector.
    status: open
    note: >-
      One shared credential for every connector makes tool-level policy unenforceable in practice, because
      every connector can then do everything the credential reaches. The gateway is ContextForge, decided in
      build-plan.md and build-brief.md; the credentials stay the client's.

  - id: MCP-POLICY-001
    title: Tool-level policy is enforced at the gateway, before the connector is reached
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      a session whose role does not hold a tool's policy gets a refusal, the connector receives no request,
      asserted by counting requests at the connector rather than by reading the refusal, and the refusal is
      recorded with the tool and the reason. A policy that lives only in the prompt the model sees fails.
    status: open
    note: >-
      system-design.md's one place where tools are registered, scoped and logged. The prompt is a
      convenience for the model and the gateway is the control. C5 paid for this distinction once already,
      when a route that existed and passed every schema check had never run.

  - id: MCP-OWNED-001
    title: The MCP gateway and every connector live in the client's estate, and tool calls keep working when we are gone
    tier: [cloud, office]
    phase: C6
    verify: >-
      every connector endpoint and the gateway are in the client's accounts or tenants; a gateway or
      connector endpoint we operate is refused by a check of the same kind intake's cord-check makes; and
      with every hostname we control blocked at the resolver, a tool call still completes. The test fails if
      any C6 component lives with us.
    status: open
    note: >-
      BIZ-INDEPENDENT-001 applied to C6, and the same reasoning that killed the hosted intake address in C5:
      a client who takes the system over cannot depend on a registry we run. **The tier is cloud and office
      rather than all three, and that is the limit stated plainly**: Standard Cloud Hosted runs in our
      account by definition, so this row constrains the components that are the client's wherever the stack
      sits, and it does not pretend a hosted deployment is independent of us.

  - id: MCP-EGRESS-001
    title: A tool call that carries client content off the machine is gated by the data class and recorded
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      with the frontier lane off, a remote tool called for a regulated data class is refused and the
      connector sees no request; with the lane on, the call is allowed only after the existing egress gate
      has seen it, and the record carries what left and the redaction summary. A remote tool call that
      reaches a third party with regulated material and no gate fails.
    status: open
    note: >-
      The rule SEC-REDACT-001 and the egress gate already apply to model calls, extended to tools, because a
      connector is a second door out of the building. For the office build this is the product's defining
      constraint rather than a compliance option.

  - id: AUD-TOOL-001
    title: Every tool call is in the chain, and every chain row traces to a tool call
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      run a task that calls tools, then count what the connector saw and what the chain holds; the two
      agree. Each row carries the tool, the connector, a digest of the arguments, the outcome, the duration
      and the session, and verify_chain passes. A call with no row, and a row with no call, both fail.
    status: open
    note: >-
      C5's AUD-WF-001 makes this claim for a workflow's own steps; this is the same claim one layer out,
      where a third party enters the system. The digest is of the arguments rather than the arguments
      themselves, so a credential or a client's document is not copied into the record twice.

  - id: AUD-SPAN-001
    title: Every sub-agent span sits under its parent task id, with its brief, its tools and its result
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      after a run with two children, the chain holds the spawn, the brief, every tool call and the return
      for each child, all addressable from the parent task id, and verify_chain passes. A child span with no
      parent row, and a parent row naming a child that has no span, both fail.
    status: open
    note: >-
      Rule 6 of six, and the difference between a sub-agent and a swarm: control never leaves the parent and
      neither does the record. It is what lets a client ask what a run did and get one answer rather than a
      transcript per child.

  - id: AUD-CHECKPOINT-001
    title: A checkpoint is a chain row, and a resume from one is recorded
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      resume a run from a checkpoint; the chain holds the checkpoint row naming the step position it
      recorded, the steps after it chain from it, and verify_chain passes. A resume that leaves no row, and
      a checkpoint naming a position the step rows contradict, both fail.
    status: open
    note: >-
      The checkpoint is the artifact that separates "the run continued" from "the run started over", and it
      is the row a support call reads first.

  - id: AUD-MODEL-001
    title: Every model call the runtime makes is addressable by the task and step that caused it
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      run a task with several model calls; each call appears in the gateway's spend log and is copied into
      the chain with the task id and the step, and a model call that cannot be traced to a task fails. A
      runtime that reaches a model without going through the gateway fails the row.
    status: open
    note: >-
      The gateway is the enforcement point for models, budgets and the data class, so the runtime cannot
      hold a second model client. This is also where the cost of a long run becomes visible per task rather
      than per deployment.

  - id: SEC-AGENT-001
    title: A sub-agent cannot hold authority its parent lacks, and a spawn that asks for more is refused
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      spawn a child naming a tool the parent does not hold; the spawn is refused with a cause naming the
      tool and the attempt is recorded. Then give a child a strict subset of the parent's tools and assert
      a call outside it is refused where the call is made rather than discouraged in the child's brief. A
      child whose scope is enforced only by its instructions fails the row.
    status: open
    note: >-
      Rule 2 of six. If a child can do more than its parent, the parent's policy is not the deployment's
      policy, and the difference is invisible in every screen that shows what the parent may do.

  - id: SEC-MCP-001
    title: The gateway refuses a call that carries no session the deployment would accept
    tier: [cloud, hosted, office]
    phase: C6
    verify: >-
      call the gateway with a connector credential and no session, with an expired session, and with a role
      supplied in the call's body; all three are refused and recorded. A tool call that reaches a connector
      without a session row fails.
    status: open
    note: >-
      The same guard SEC-APR-001 and SEC-AUTH-001 place on the API, repeated at the gateway because a tool
      call does not always pass through the API. Two places making one claim is a cost, and the alternative
      is a second door with a different lock.

  - id: NEVER-KB-001
    title: No managed knowledge base
    tier: [cloud, hosted]
    phase: NEVER
    verify: not applicable
