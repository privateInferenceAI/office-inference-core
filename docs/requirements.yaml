# The requirements register.
#
# Every item that must be true before this system can be sold, deployed, and supported. The build
# is not finished while any item is open. scripts/check_requirements.py fails the build when an item
# has no phase, no verification, an unknown status, or a waiver without a reason.
#
# phase:   C0..C9 for the cloud build, OFFICE for the office build, DEPLOY for per-deployment work,
#          BIZ for commercial and legal work, NEVER for decisions not to build something.
# status:  open | verified | waived  (waived requires waiver_reason)
# verify:  the test that would FAIL if the requirement were not met. If you cannot write one, the
#          requirement is a wish and belongs in status: open with a note.
#
# ---------------------------------------------------------------- C1 and C2, closed together
#
# All 30 C1 and C2 items read `verified` against the deployed store. That was true before the C2
# deliverable review ran, and it is what made the review necessary: a register can be accurate about the
# code and wrong about the phase, which is exactly what happened here.
#
# What was missing was step 2 of "What finished means" — the operating pages — and then steps 3 and 4.
# Those are now done for C2, and the evidence is:
#
#   docs/manual.md              the six operating pages, 13a to 13f
#   docs/reviews/c2-round-1.md  the original panel: 42 findings, three agents, all three verdicts "no"
#   docs/review-log.md          rounds 5 and 6, what each covered and what it caught
#
# Three rounds ran. Round 3 returned fourteen findings and a scoped re-check of the fifteen corrections
# returned twelve right and three wrong, all three of them cross-references and a count rather than a
# behavioural claim. The process caps at three rounds and stops when a round returns only cosmetics; that
# is the state recorded here, and it is a judgement rather than a measurement.
#
# **C1's items are a weaker version of this claim than C2's.** They were reviewed by earlier rounds in
# docs/review-log.md, but those rounds predate the C2 work and the manual has changed a great deal since
# (section 9's service list, section 3's machine row, the paths table). No review has re-run C1's own
# pages against the box since. Nothing here is known to be wrong; it is known not to have been re-checked.
#
# The end-to-end build from zero — docs/runbook.md step 3.15 — has still never been run. It is the one
# thing that tests the images as a reader receives them, and it is the next step rather than part of this
# closure.

items:
  # ---------------------------------------------------------------- identity and access
  - id: SEC-AUTH-001
    title: Roles come from an authenticated session, never a caller-supplied parameter
    tier: [cloud, hosted]
    phase: C7
    verify: with no token and with a forged role header, the API refuses; both attempts appear in audit_events
    status: open
  - id: SEC-AUTH-002
