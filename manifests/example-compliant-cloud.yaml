# Example: compliant cloud. Client's account, compliance-grade services and agreements.
manifest_version: 1
client:
  name: Example Medical Group
  deployment_id: example-medical-compliant
profile: cloud
packs: [document-chat, agentic-desk, compliance-pack]
models:
  analyst:
    local: ""
    frontier: bedrock/us.anthropic.claude-sonnet-5
  front_desk:
    local: ""
    frontier: bedrock/us.anthropic.claude-haiku-5-5
  reader:
    local: ""
    frontier: bedrock/us.anthropic.claude-sonnet-5
lanes:
  frontier:
    enabled: true
    provider: bedrock
    account_owner: client
    data_classes_allowed: [public, internal, confidential, regulated]
    requires_approval: false
    redaction: true
access:
  # The egress gate reads this block, not the lane's list above. Both carry the same classes on purpose:
  # declaring only lanes.frontier.data_classes_allowed validates, then renders an empty permission set,
  # and the gate refuses every request on a compliant deployment that believes it permits four classes.
  denial: denied
  egress:
    frontier_classes: [public, internal, confidential, regulated]
    redaction: "on"
budgets:
  # Per-role ceilings in USD, enforced by the gateway, which refuses a request once recorded spend is over
  # the ceiling. Internal cost control, not client billing.
  #
  # **Not a hard cap, and the wording is deliberate.** LiteLLM checks admission against RECORDED spend, so
  # concurrent requests can all pass before any of them is counted (open issues #34732 and #35567 as of
  # 2026-10-14). This stops a runaway. It does not make the number unexceedable, and no client should be
  # told otherwise. The ceilings that hold are the egress gate, which decides what may leave at all, and a
  # per-request max_tokens.
  period_days: 30
  roles:
    analyst: 50
    front_desk: 5
    reader: 50
compliance:
  profile: hipaa
  # Decides which model forms are allowed. A global inference profile can route a prompt to any
  # Region, so a regulated deployment names the geography it accepts.
  data_residency: ["United States"]
  baa_with_provider: true
  baa_with_office_inference: true
  worm_storage: false
  audit_retention_days: 2190
integrations:
  - id: microsoft-365
    scopes: [mail.send, files.read]
interface:
  show_lane_indicator: true
support:
  response_window: business hours, 4 hours

# What this deployment lets a person start. The app's Do screen is built from this block, and the routing
# trigger reads it too, so the thing a client sees offered and the thing that escalates a model cannot
# drift apart.
#
# **`tier` is where the email-versus-codebase decision is made.** A task that needs the cheap model names
# one role; a task that synthesises across documents names another. The interface sends a task and never a
# model, which is what keeps "why did this content reach a provider" answerable with a declared permission
# rather than with a heuristic.
agentic:
  tasks:
    - id: draft
      label: Draft a reply
      description: Write a reply to a message, using your own documents as the source.
      tier: front_desk
      touches: [documents, mail.draft]
      needs_approval: true
    - id: reconcile
      label: Reconcile two documents
      description: Compare the figures in two documents and list where they disagree.
      tier: analyst
      touches: [documents]
      needs_approval: false
    - id: summarise_across_documents
      label: Summarise across several documents
      description: Read a set of documents and write one summary that cites each source.
      tier: reader
      touches: [documents]
      needs_approval: false
