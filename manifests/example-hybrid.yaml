# Example: hybrid. Office build, documents stay, frontier lane on for code and long chains.
manifest_version: 1
client:
  name: Example Accounting
  deployment_id: example-accounting-hybrid
profile: hybrid
packs: [document-chat, workflow-automation, agentic-desk, frontier-lane]
models:
  analyst:
    local: qwen3-32b-instruct
    frontier: bedrock/us.anthropic.claude-opus-5-5
  front_desk:
    local: qwen3-8b-instruct
    frontier: bedrock/us.anthropic.claude-haiku-5-5
  reader:
    local: qwen3-vl-32b-instruct
    frontier: bedrock/us.anthropic.claude-sonnet-5
  coder:
    local: ""
    frontier: bedrock/us.anthropic.claude-sonnet-5
lanes:
  local: {enabled: true}
  frontier:
    enabled: true
    provider: bedrock
    account_owner: client
    data_classes_allowed: [public, internal]
    requires_approval: true
    redaction: true
access:
  # The egress gate reads this block, not the lane's list above. Same classes in both places until the
  # overlap is resolved; declaring only the lane's list renders an empty permission set and refuses
  # everything, including the public material this hybrid build is meant to send.
  denial: denied
  egress:
    frontier_classes: [public, internal]
    redaction: "on"
budgets:
  # Per-role ceilings in USD. A hard cap: the gateway refuses over-budget requests rather
  # than alerting about them. Example figures for a small firm.
  period_days: 30
  roles:
    analyst: 50
    front_desk: 5
    reader: 50
    coder: 20
compliance:
  profile: contractual
  baa_with_office_inference: false
  audit_retention_days: 365
integrations:
  - id: quickbooks
    scopes: [read]
  - id: microsoft-365
    scopes: [mail.send, files.read]
interface:
  branding:
    display_name: Firm Assistant
  show_lane_indicator: true
support:
  remote_access: true
  response_window: business hours, 4 hours
