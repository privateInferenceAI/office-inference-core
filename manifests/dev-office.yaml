# Development manifest for the Phase 1 smoke test.
# One small CPU model serves every role, because this box has no GPU yet. Roles become
# distinct models when the real hardware arrives; nothing else about the system changes.
manifest_version: 1
client:
  name: Office Inference Dev
  deployment_id: oi-core-dev
profile: office
packs: [core]
models:
  analyst:
    local: qwen3-1.7b-instruct
  front_desk:
    local: qwen3-1.7b-instruct
  reader:
    local: qwen3-1.7b-instruct
lanes:
  frontier:
    enabled: false
compliance:
  profile: none
  audit_retention_days: 90
access:
  # What a user is told when their role excludes content that would answer the question. silent tells them
  # nothing; denied says documents exist that they cannot see; counted also says how many passages were
  # withheld. The trade is the client's: disclosing reveals that restricted content EXISTS, and staying
  # silent makes a partial answer look complete.
  #
  # This build says denied, the default. The cloud development manifest says counted, because a developer
  # debugging a missing passage wants the number and there is no client to weigh the trade.
  denial: denied

  # This build has no frontier lane at all: inference is local, so nothing leaves the building. The empty list
  # is the policy and not an oversight, and the gate reads it as "nothing is permitted" rather than as "no
  # opinion", which is why an unset variable refuses instead of defaulting to something.
  egress:
    frontier_classes: []
    redaction: "on"
