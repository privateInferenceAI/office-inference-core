# Example: standard cloud. Frontier models, no compliance claim.
manifest_version: 1
client:
  name: Example Company
  deployment_id: example-standard-cloud
  contacts:
    - role: owner
      email: owner@example.com
profile: cloud
packs: [document-chat, workflow-automation]
models:
  analyst:
    local: ""
    frontier: bedrock/us.anthropic.claude-sonnet-5
  front_desk:
    local: ""
    frontier: bedrock/us.anthropic.claude-haiku-5-5
  reader:
    local: ""
    frontier: bedrock/us.anthropic.claude-haiku-5-5
lanes:
  frontier:
    enabled: true
    provider: bedrock
    account_owner: client
    data_classes_allowed: [public, internal, confidential]
    requires_approval: false
    # True, matching access.egress.redaction below. The egress gate reads THAT value, so a lane block
    # declining redaction while the gate enforces it is decoration rather than policy -- and it made this
    # shipped example emit a divergence warning that a reader would learn to ignore.
    redaction: true
access:
  # Read this block, not the lane's list above. The egress gate renders from
  # access.egress.frontier_classes, so a manifest declaring only lanes.frontier.data_classes_allowed
  # validates and then renders an empty permission set, which refuses every request without saying why.
  # Both places carry the same classes until that overlap is resolved.
  #
  # redaction is "on" here while lanes.frontier.redaction above says false, and that mismatch is worth
  # seeing rather than hiding: the renderer defaults access.egress.redaction to "on", so this deployment
  # redacts today whether or not the lane block says otherwise. Turning it off is a client's decision to
  # make explicitly, and a standard-cloud build that intends to send confidential material unredacted
  # should say so here rather than only in the lane block, which nothing reads.
  denial: denied
  egress:
    frontier_classes: [public, internal, confidential]
    redaction: "on"
budgets:
  # Per-role ceilings in USD. A hard cap: the gateway refuses over-budget requests rather
  # than alerting about them. Example figures for a small firm.
  period_days: 30
  roles:
    analyst: 50
    front_desk: 5
    reader: 50
compliance:
  profile: none
  audit_retention_days: 90
integrations:
  - id: google-workspace
    scopes: [calendar.readonly, gmail.compose]
interface:
  branding:
    display_name: Example Company Assistant
  show_lane_indicator: true
support:
  response_window: business hours, 4 hours
