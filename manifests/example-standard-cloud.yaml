# Example: standard cloud. Frontier models, no compliance claim.
manifest_version: 1
client:
  name: Example Company
  deployment_id: example-standard-cloud
  contacts:
    - role: owner
      email: owner@example.com
profile: cloud
packs: [document-chat, workflow-automation]
models:
  analyst:
    local: ""
    frontier: bedrock/us.anthropic.claude-sonnet-5
  front_desk:
    local: ""
    frontier: bedrock/us.anthropic.claude-haiku-5-5
  reader:
    local: ""
    frontier: bedrock/us.anthropic.claude-haiku-5-5
lanes:
  frontier:
    enabled: true
    provider: bedrock
    account_owner: client
    data_classes_allowed: [public, internal, confidential]
    requires_approval: false
    redaction: false
budgets:
  # Per-role ceilings in USD. A hard cap: the gateway refuses over-budget requests rather
  # than alerting about them. Example figures for a small firm.
  period_days: 30
  roles:
    analyst: 50
    front_desk: 5
    reader: 50
compliance:
  profile: none
  audit_retention_days: 90
integrations:
  - id: google-workspace
    scopes: [calendar.readonly, gmail.compose]
interface:
  branding:
    display_name: Example Company Assistant
  show_lane_indicator: true
support:
  response_window: business hours, 4 hours
