# Capability packs
#
# What we sell, and what each pack turns on. A client buys packs; a pack expands to services and
# configuration. The Core pack is implicit in every deployment and is never sold on its own.

packs:
  - id: core
    name: Core System
    sold: false
    description: The system itself. Gateway, interface, database, object store, secrets, ingress, audit sink, observability, backup, and the office operational services on the office build.
    services:
      - gateway
      - interface
      - database
      - object-store
      - secrets
      - ingress
      - audit-sink
      - observability
      - backup
      - updater          # office only
      - remote-support   # office only
      - drift-reporter   # office only

  - id: document-chat
    name: Document Chat
    sold: true
    description: Ask questions across the client's own documents, with citations and per-role access.
    services:
      - ingestion
      - parser
      - vector
      - embeddings
      - reranker
    requires: [core]

  - id: workflow-automation
    name: Workflow Automation
    sold: true
    description: Multi-step work with triggers, schedules, and approval gates. Deterministic, so it behaves the same on any model.
    services:
      - workflow
    requires: [core]
    # Read 2026-10-13 at https://github.com/n8n-io/n8n/blob/master/LICENSE.md (Sustainable Use
    # Licence). The clause, verbatim: "You may use or modify the software only for your own internal
    # business purposes or for non-commercial or personal use. You may distribute the software or
    # provide it to others only if you do so free of charge for non-commercial purposes."
    #
    # That is not a terms question that Enterprise resolves by default: it restricts the paid client
    # build this pack is sold as. The question is open with a named owner rather than assumed
    # answered, because the answers are a commercial decision (buy Enterprise, ship a different
    # workflow engine, or stop selling this pack) and none of them is an edit to this file.
    open_question: "n8n Sustainable Use Licence: does it permit deploying n8n into a client's building as part of a paid build? On its face it does not - 'provide it to others only if you do so free of charge for non-commercial purposes'. Needs a decision, not a reading."

  - id: agentic-desk
    name: Agentic Desk
    sold: true
    description: The agent loop with tools, sessions, and human approval. Delivered as a real agent only where the model tier supports it.
    services:
      - agent-runtime
      - mcp-gateway
      - connectors
    requires: [core, document-chat]
    # **Definitions are the pack's content, not the manifest's.** A client buys the pack; the pack names the
    # jobs the runtime can run, the role that answers, the tools each may use and the budgets it runs under.
    # The renderer resolves these into rendered/agent_definitions.json so a deployment with no agentic pack has
    # no definitions and refuses the task by name. A definition is not a prompt in code; it is configuration.
    definitions:
      - id: research_brief
        label: Research and brief
        description: >-
          Research a question across the client's documents, use one read-only helper for a narrow lookup,
          and produce a brief with citations. Stops for approval before any irreversible action.
        mode: task
        role: analyst
        tools: [search_documents, read_passages, query_rows]
        child_tools: [search_documents, read_passages]
        irreversible_tools: [send_email]
        max_steps: 12
        max_seconds: 600
        max_tokens: 60000
        child_max_seconds: 120
        child_max_tokens: 12000
        verify: citations_present
        needs_approval: true

  - id: workspace
    name: Cloud Workspace
    sold: true
    description: >-
      A task-scoped cloud workspace: files, shell and code execution in a destroyed-at-the-end sandbox,
      an allowlisted web path, and artifacts in the client's store. Cloud and hosted only.
    services:
      - workspace-host
      - egress-proxy
      - artifact-store
    requires: [core, document-chat, agentic-desk]
    definitions:
      - id: workspace_brief
        label: Workspace brief
        description: >-
          Work in a task-scoped sandbox: write files, run code and produce an artifact, then return a brief
          with citations. The sandbox has no network; an approved URL is fetched through the egress service.
        mode: task
        role: analyst
        tools: [search_documents, read_passages, workspace_write, workspace_read, workspace_list, workspace_run,
                web_fetch, send_email]
        child_tools: [search_documents, read_passages]
        workspace: true
        web: true
        connector: true
        irreversible_tools: [send_email]
        max_steps: 14
        max_seconds: 600
        max_tokens: 80000
        verify: citations_present
        needs_approval: true

  - id: voice
    name: Voice
    sold: true
    description: Talk to the system. Cascade (speech to text, then model, then text to speech) so every turn is auditable.
    services:
      - voice
    requires: [core]
    locations: [office]

  - id: frontier-lane
    name: Frontier Lane
    sold: true
    description: Turn on the connection to frontier models for heavy reasoning, agentic chains, and code. Off by default. Every call logged, and gated by data class.
    services:
      - inference-frontier
      - model-router
    requires: [core]
    requires_profile: [cloud, hybrid]
    requires_client_account: true

  - id: compliance-pack
    name: Compliance Pack
    sold: true
    description: The controls a regulated client needs, configured and documented, with the evidence package.
    services:
      - redaction
    requires: [core]
    open_question: Which frameworks to document first. HIPAA and GLBA appear to be the common cases.

  - id: offsite-backup
    name: Offsite Backup
    sold: true
    description: Encrypted backup to the client's own cloud account. They hold the key, so a backup is not a disclosure.
    services: []
    config:
      backup:
        target: s3
        encryption: client-side
        key_owner: client
    requires: [core]
    requires_client_account: true
