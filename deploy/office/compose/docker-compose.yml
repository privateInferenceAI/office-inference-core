# One compose file, two builds. The cloud build sends every generation call to Bedrock and starts
# the gateway and the database. The office build adds the local lane, whose container sits behind
# the "office" compose profile; the renderer turns that profile on from the manifest.
#
# Run from the repo root on the host:
#   docker compose -f deploy/office/compose/docker-compose.yml --env-file rendered/env up -d
#
# Deliberately publishes NOTHING. Services are reachable only on the ai-net bridge. The
# first security boundary is that the host has no listener to attack. Ingress arrives in a
# later phase, and it will be the only thing that ever binds a port.
#
# Images are digest-pinned with the version recorded beside the pin. That habit exists
# because an earlier stack pinned a gateway by digest with no version written down, and
# nobody could answer the first question a security review asks.

name: oi-core

services:
  postgres:
    # Stable infrastructure: version tag, because a patch release here is a tested upgrade
    # path and alpine keeps the image small on a 30 GB disk.
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${OI_ROOT}/data/postgres:/var/lib/postgresql/data
      # Deliberately NOT mounting db/migrations into /docker-entrypoint-initdb.d. That was here
      # once, and it broke every fresh install: the entrypoint runs those files against a virgin
      # data directory, which creates our audit tables in the same database the gateway owns.
      # LiteLLM's Prisma migrations then refuse to baseline a schema they did not create, and the
      # gateway restart-loops with "Database migration cannot proceed".
      #
      # Our migrations run through `audit migrate` instead, which is the only path that is ordered,
      # checksummed, and recorded in schema_migrations. The entrypoint path only ever worked on an
      # empty data directory, so it was never the real path anyway.
    networks: [ai-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Embeddings and reranking, both on CPU through the same image, both unmodified upstream.
  # Text Embeddings Inference from Hugging Face, Apache-2.0, read 2026-10-13 at
  # https://github.com/huggingface/text-embeddings-inference/blob/main/LICENSE
  # The model WEIGHTS are licensed separately from the server and both are commercially clean:
  # bge-m3 is MIT (https://huggingface.co/BAAI/bge-m3) and bge-reranker-v2-m3 is Apache-2.0
  # (https://huggingface.co/BAAI/bge-reranker-v2-m3). A model card, not a LICENSE file, is the
  # authority for the weights; neither repository ships one.
  # The models are downloaded on first start into a shared cache under OI_ROOT, so a rebuild does not
  # re-download them and an air-gapped office build can ship with the cache pre-filled.
  embeddings:
    # ghcr.io/huggingface/text-embeddings-inference:cpu-1.9. The cpu- prefix is load-bearing: the
    # bare 1.9 tag is the CUDA build and fails on a box with no GPU.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    container_name: embeddings
    restart: unless-stopped
    command:
      - "--model-id=BAAI/bge-m3"
      - "--port=80"
      # **8192 rather than 4096, because truncation cannot be disabled below the model's maximum.**
      # TEI refuses to start with `--auto-truncate=false` when the model's 8,192-token maximum input exceeds
      # `--max-batch-tokens`, and that refusal is correct: the two settings would otherwise disagree about what
      # a servable input is. The chunker's own budget is 512 measured tokens, so this ceiling is headroom.
      - "--max-batch-tokens=8192"
      - "--max-concurrent-requests=16"
      # **Truncation off, so an oversized input fails loudly instead of becoming a prefix.** The default is
      # true, and it is how 73 documents came to hold vectors representing the first tokens of their text while
      # looking ingested. The worker also refuses to run while this reports true (`RET-CHUNK-001`).
      - "--auto-truncate=false"
    environment:
      HF_HOME: /data
      # A ten-minute first boot becomes twenty seconds with the warmup bounded.
      MAX_WARMUP_SEQUENCE_LENGTH: "256"
      MAX_WARMUP_BATCH_SIZE: "4"
    volumes:
      - ${OI_ROOT}/data/hf-cache:/data
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # The CPU reranker is a benchmark instrument, not a serving component. Measured 2026-10-11 at
  # roughly 2.5 to 3 ms per token of candidate text, which is three or four 500-token chunks inside a
  # five-second budget. That is why it sits behind a profile: the cloud build reranks at Bedrock, on
  # hardware that is not ours, so nothing starts this on purpose. It stays because it produced the
  # number. Start it explicitly with --profile bench.
  reranker:
    # ghcr.io/huggingface/text-embeddings-inference:cpu-1.9. The cpu- prefix is load-bearing: the
    # bare 1.9 tag is the CUDA build and fails on a box with no GPU.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    container_name: reranker
    profiles: ["bench"]
    restart: unless-stopped
    command:
      - "--model-id=BAAI/bge-reranker-v2-m3"
      - "--port=80"
      - "--max-batch-tokens=8192"
      # Permits are consumed per candidate, not per inference batch, and a request that cannot get
      # one is refused with 429 immediately rather than queued. Measured on this instance
      # 2026-10-11: at the 8 this shipped with, nine candidates in one call were refused because it
      # asked for nine permits, and of three concurrent eight-candidate calls only one succeeded
      # while the other two failed in 17 to 27 ms. A pool of N candidates therefore needs N permits,
      # and 64 leaves room for the benchmark's chunking plus a concurrent probe. TEI's own queue is
      # what serialises the forward passes, not this number.
      - "--max-concurrent-requests=64"
    environment:
      HF_HOME: /data
      MAX_WARMUP_SEQUENCE_LENGTH: "256"
      MAX_WARMUP_BATCH_SIZE: "4"
    volumes:
      - ${OI_ROOT}/data/hf-cache:/data
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  # The parser: documents become structured text with page numbers, before anything is chunked or
  # embedded. Docling Serve, MIT, read 2026-10-13 at
  # https://github.com/docling-project/docling-serve/blob/main/LICENSE (IBM copyright). That is
  # docling-serve's own file rather than docling's; the projects are separate repositories with
  # separate licences, and this citation pointed at neither before.
  # The layout and TableFormer weights are cdla-permissive-2.0 and apache-2.0 respectively.
  #
  # It is its own service rather than a library inside the ingestion worker for one reason: the
  # layout, table and OCR models are the largest thing in the pipeline, and a worker that restarts on
  # every document change should not reload them.
  parser:
    # Our wrapper over the same image, not docling-serve itself.
    #
    # Why the swap. docling-serve computes the per-page confidence report and serialises only the
    # document-level rollup, which its own code acknowledges: "Document-level only. A per-page breakdown can
    # be added later as an optional ``pages`` field". That breakdown is what tells a reader which pages were
    # read off an image. Without it a mixed filing is labelled one way for the whole document, so a figure
    # recognised from a scan is presented as text that was already there.
    #
    # The base is the same image and the same weights, so this adds one Python file rather than a second
    # copy of 2 GB of models. Verified 2026-10-13 on the mixed-scan fixture: it reports an ocr_score for
    # pages 2 and 4 and null for pages 1 and 3, which is exactly the fixture's construction, in 11 seconds.
    build:
      context: ../../../services/parser
      dockerfile: Dockerfile
    image: oi-core/parser:local
    container_name: parser
    restart: unless-stopped
    environment:
      # No remote services, no external plugins, no UI and no API docs, because this service does not offer
      # them: it is one endpoint that converts a document. The surface that docling-serve had to switch off
      # one variable at a time does not exist here, which is the smaller attack surface that came free with
      # the wrapper.
      #
      # One conversion at a time. The models are the memory, and a second concurrent conversion is a second
      # copy of them on a box sized for one.
      PARSER_MAX_CONCURRENT: "1"
      PARSER_UPLOAD_DIR: /tmp/oi-parser
      # Structured logs, so a parse failure is greppable rather than a paragraph.
      DOCLING_SERVE_LOG_LEVEL: INFO
      # This box is 16 vCPU and its default of 4 leaves three quarters idle, on the slowest stage in
      # ingestion. The workers are threads inside one process and they share the loaded models, which
      # is the configuration that matters on a 64 GB box: the alternative allocates a second copy of
      # every model per worker.
      DOCLING_NUM_THREADS: "12"
      DOCLING_SERVE_ENG_LOC_NUM_WORKERS: "1"
      DOCLING_SERVE_ENG_LOC_SHARE_MODELS: "true"
      DOCLING_DEVICE: cpu
      # The synchronous endpoint's wait, raised from its 120-second default. The worker uses the
      # asynchronous endpoint precisely because this limit exists and because the handler does not abort
      # the task when it fires (`# TODO: abort task!` in docling-serve 1.36), so a timeout orphans a parse.
      # The value is kept honest rather than made enormous: it is a boundary for anything else that talks
      # to this service synchronously, not the mechanism the worker relies on.
      DOCLING_SERVE_MAX_SYNC_WAIT: "600"
      # No DOCLING_SERVE_ARTIFACTS_PATH, and that is a decision rather than an omission. The variable
      # does not mean "cache the models here": it means "load the models from here and never download
      # them". Pointing it at an empty directory tells the service its weights are missing and forbids
      # it from fetching them, which is exactly how this container failed its first start:
      # "artifacts_path is set to a valid directory. No model weights will be downloaded at runtime",
      # then FileNotFoundError for the RapidOCR checkpoints under /data/RapidOcr. The image already
      # carries every weight it needs, which is why the pull is 2 GB, so the correct configuration is
      # to let it use them. An air-gapped office build is served better by weights inside the image
      # than by a cache directory: there is nothing to fill and nothing to download at run time.
    networks:
      - ai-net
    healthcheck:
      # Python rather than curl: this image installs tesseract and GL libraries and no HTTP client, so a
      # curl healthcheck would fail with "not found" and the container would never be healthy. It is a UBI
      # Python image, so the interpreter is the one thing guaranteed to be there.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=4)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 300s

  # The ingestion worker: a document on disk becomes chunks in the vector store, once.
  #
  # Built from this repository rather than pulled, because this is the part of the pipeline that is ours.
  # Parsing is Docling's, embedding is TEI's, storage is Qdrant's, and the policy that makes a re-run safe
  # is the module this container runs.
  ingestion:
    build:
      # The context is the service directory so the image carries two files rather than the repository.
      context: ../../../services/ingestion
      dockerfile: Dockerfile
    image: oi-core/ingestion:local
    container_name: ingestion
    restart: unless-stopped
    environment:
      # The manifest, so an unchanged document is skipped rather than re-embedded. Without this the worker
      # falls back to an in-memory manifest and re-ingests everything every cycle, which it says out loud
      # in its output rather than doing quietly.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PARSER_URL: http://parser:5001
      EMBED_URL: http://embeddings:80
      VECTOR_URL: http://vector:6333
      COLLECTION: documents
      # Every 15 minutes. A cycle with no changes costs one read per file, so the interval is cheap and
      # the delay before a new document is retrievable is what it buys.
      INGEST_INTERVAL_SECONDS: "900"
      INGEST_EMBED_BATCH: "16"
      # **Two, because the embedding service can hold about one full batch at this size.** Each embedding
      # request is bounded near the service's batch-token cap, so a window of four fills its queue and it
      # answers 429; the worker now backs off and retries, but a window that does not provoke the queue is
      # cheaper than one that does. The deeper fix (pacing by stage, so a bulk load and a quiet cycle are not
      # the same setting) is RET-INGEST-002 and stays open.
      # **One, because a window of two is what provokes the 429.** A bulk load of large documents sends two
      # near-cap requests at once; the embedding service sheds one, the retries expire and the document fails
      # until the next cycle, then pays the parse cost again. That is how the 2026-10-17 corpus load spent its
      # last hours: 66 large documents cycling between 429 and re-parse. One writer and a larger request per
      # writer keeps the service fed without ever asking it for more than one batch at a time.
      # The staging fix that would let a quiet cycle and a bulk load use different settings is RET-INGEST-002.
      INGEST_CONCURRENCY: "1"
      INGEST_EMBED_TOKEN_BUDGET: "7000"
      # Where the rejected-documents worklist is written. Mounted from the host below, so an operator opens
      # rejected/rejected.csv next to the deployment rather than querying a manifest table.
      INGEST_REJECTED_DIR: /rejected
      INGEST_MAX_FAILURES: "2"
      INGEST_STATE_PATH: /state/last-cycle.json
    volumes:
      # Read-only. This worker never writes to a client's documents, and a mount that cannot be written to
      # is the cheapest way to keep that true.
      - ${OI_ROOT}/documents:/documents:ro
      # The rejected-documents worklist. Must exist and be writable by uid 10001; the manual's ingest step
      # creates it. A rejected file that nobody can see is the failure this mount exists to prevent.
      - ${OI_ROOT}/rejected:/rejected
      # The cycle record the healthcheck reads. A named volume rather than a bind mount, because it is
      # this container's own state and nothing else has business reading it.
      - ingestion-state:/state
    networks:
      - ai-net
    depends_on:
      - postgres
      - parser
      - embeddings
      - vector
    # A shell loop rather than a scheduler, because the schedule is one interval and a scheduler would be
    # a second thing to configure and to monitor. The cycle is the command; the loop is when it runs.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          python3 /app/ingest.py --documents /documents --json || echo "cycle exited non-zero"
          sleep "$${INGEST_INTERVAL_SECONDS:-900}"
        done
    healthcheck:
      # Reads the last cycle's outcome rather than checking that the process is alive. This worker has no
      # listening socket, so "is it up" is not a question it can answer, and a healthcheck that only
      # proves the process exists stays green while every document fails.
      test: ["CMD", "python3", "/app/ingest.py", "--status", "--state", "/state/last-cycle.json"]
      interval: 300s
      timeout: 30s
      retries: 3
      # Long, because a first cycle on a client's corpus parses every document through OCR.
      start_period: 3600s

  # The vector store: chunks, their embeddings, and the access labels the search filters on.
  # Qdrant v1.19.2, current release line as of 2026-10-11.
  vector:
    # The image ships neither curl nor wget, so there is no healthcheck here on purpose. Readiness is
    # checked from another container, which is how the runbook proves it, and the ingestion worker
    # retries rather than assuming the store is up.
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    container_name: vector
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ${OI_ROOT}/data/qdrant:/qdrant/storage
    networks:
      - ai-net

  llamacpp:
    # llama.cpp server: the CPU path, and the local lane's only implementation. The cloud build
    # has no local lane, so this sits behind a compose profile. Gating it here rather than in a
    # second compose file is what keeps one file for both builds; the renderer sets
    # COMPOSE_PROFILES from the manifest's profile field.
    profiles: ["office"]
    image: ghcr.io/ggml-org/llama.cpp@sha256:bf3da52e92c083472b3d1c9f9da081f423ab9def95a87ec4bba51940382d75fd  # llama.cpp server, pinned 2026-10-10
    container_name: llamacpp
    restart: unless-stopped
    command:
      - "-m"
      # Defaults are empty on purpose. Compose interpolates every variable in this file whatever
      # profiles are active, so a cloud build would otherwise warn about three settings its
      # profile excludes. The renderer always writes these for an office manifest, so the empty
      # default only ever applies to the build that does not start this container.
      - "/models/${MODEL_FILE:-}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${MODEL_CTX:-8192}"
      - "-t"
      - "${MODEL_THREADS:-4}"
      - "--jinja"
    volumes:
      - ${OI_ROOT}/models:/models:ro
    networks: [ai-net]

  litellm:
    # LiteLLM v1.104.2, pinned 2026-10-10.
    # Version matters: CVE-2026-59822 (MCP authentication bypass, CVSS 8.8, in CISA's KEV
    # catalog) affects everything before 1.84.0, and CVE-2026-42271 affects 1.74.2 to 1.83.7.
    # Model swaps, budgets, and the audit trail all live here, which is why it is the one
    # component we never leave unpinned or unversioned.
    # litellm 1.104.2, read from the running container on 2026-10-14. The version is recorded because the rule
    # says a pin without one cannot answer the first question a security review asks, and because this image
    # was the one place in the deployment where nobody could say which version was running.
    #
    # Against the advisories that mattered: CVE-2026-59822 (MCP auth bypass, before 1.84.0) and CVE-2026-42208
    # (pre-auth SQL injection in key verification, 1.81.16 to 1.83.6) are both behind this pin.
    build:
      context: ${OI_ROOT}
      dockerfile: services/litellm/Dockerfile
    image: oi-core/litellm:local
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_LOG: WARNING
      # Bedrock, for the cloud build's frontier lane. The gateway picks up credentials from the
      # instance role through the metadata service, so no key material lands in this file. The
      # hop limit is 2, which is what lets a container reach the metadata service at all.
      AWS_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
      # Where the identity hook reads the signing key and the spent-statement list. The key is a file rather
      # than a variable because an environment variable is visible to `docker inspect` and to anything that
      # can read /proc, and this one is the difference between speaking as a role and not.
      OI_ASSERTION_KEY: /app/rendered/assertion.key
      OI_ASSERTION_NONCES: /tmp/oi-assertions-seen.json
    volumes:
      - ${OI_ROOT}/rendered/litellm.yaml:/app/config.yaml:ro
      # The whole rendered directory rather than the one file, because the signing key and the nonce list live
      # there too. Read-only: the gateway verifies statements, it does not mint them.
      - ${OI_ROOT}/rendered:/app/rendered:ro
    # Deliberately no dependency on llamacpp. Compose refuses a project whose dependency sits in
    # an inactive profile ("depends on undefined service"), which would make the cloud build
    # invalid. The gateway does not need the local lane to boot: it needs it per request, and only
    # on the office build, so readiness belongs in the installer's health check rather than in an
    # ordering hint here.
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-net]

  keys:
    # Mints and updates the per-role virtual keys, and runs the drill that proves a budget is a
    # ceiling rather than a notification. A tool, like the audit sink: it runs when called and exits.
    #
    # It is deliberately the only thing besides the gateway itself that reads the master key, and it
    # reads it from the rendered env file rather than from this file's environment. That is what
    # makes the master key an administration credential instead of a shared secret, and it is why
    # no other service here has it.
    build:
      context: ${OI_ROOT}
      dockerfile: services/gateway/Dockerfile
    container_name: keys
    profiles: ["tools"]
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      LITELLM_URL: http://litellm:4000
      # **The database, because the emergency brake writes the team row.** `keys --set-budget` sets a
      # ceiling on the row the auth hook reads, so it needs a connection. Without this the documented
      # command could not run at all, and the tool told the operator to go somewhere rendered/env
      # already was. Found by the C3 panel's fidelity checker.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ${OI_ROOT}/rendered:/app/rendered
    networks: [ai-net]

  eval:
    # The evaluation harness, run when called and exits like the other tools.
    #
    # Its own image because it needs a YAML parser for the question set and the retrieval half of the codebase,
    # which the worker does not. The retriever and ingestion modules come from the mounted checkout so the image
    # cannot carry a stale second copy of them.
    build:
      context: ${OI_ROOT}/services/eval
    image: oi-core/eval:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      EMBED_URL: http://embeddings:80
      VECTOR_URL: http://vector:6333
      COLLECTION: ${COLLECTION:-documents}
      QUESTIONS: /w/fixtures/corpus/questions.yaml
      # Under /tmp rather than the mounted checkout: the tool runs as an unprivileged user and the checkout is
      # owned by the operator, so writing beside the questions failed with PermissionError after a full run had
      # already been printed. /tmp is where a container can write, and the operator copies it out.
      REPORT_OUT: /tmp/eval-report.json
      # Where the mounted checkout keeps the other services. `harness.py` sits in this image at /app and cannot
      # work that out from its own location, so the image is told.
      RETRIEVAL_PATH: /w/services/retrieval
      INGESTION_PATH: /w/services/ingestion
    networks: [ai-net]

  retention:
    # The commands that delete a client's document and, at the end, everything. A tool rather than a service,
    # like the audit sink, because it runs when called and exits.
    #
    # A separate image from the audit service even though both are tools, because this one reaches stores the
    # audit service does not know about. A command that clears the vector index should not live inside the thing
    # that records what happened, or the recorder becomes a component that can delete the record.
    build:
      context: ${OI_ROOT}/services/retention
    image: oi-core/retention:local
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      VECTOR_URL: http://vector:6333
      COLLECTION: ${COLLECTION:-documents}
      # Where the client's files are. Retention destroys those as well as the indexes, because a period running
      # out means there is no document, and a run that cleared the indexes and left the file would report
      # success while the thing the client asked to be destroyed sat in their documents directory.
      DOCUMENTS_ROOT: /documents
    # Runs as the operator, like every other tool here, and **this line is what makes destruction
    # possible at all.** The image ships its own unprivileged user (uid 10002) and the documents mount
    # belongs to the operator (uid 1000), so without this the container can read a client's files and
    # cannot unlink one: the image user has no write bit on the documents directory, and unlinking needs
    # one on the DIRECTORY rather than on the file.
    #
    # It failed as `PermissionError: [Errno 13]` on the first real retention run ever attempted on a
    # deployment, after the failure above it was fixed. Both were invisible for the same reason: every
    # rehearsal returns before the deletion happens, so a dry run tested the dry run. An operator who
    # ran the rehearsal, saw it pass, and scheduled the real thing would have had a job that reported
    # INCOMPLETE every night and never destroyed anything.
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      # Read-write, because retention unlinks the client's files. Read-only would make every destruction fail on
      # the unlink after the stores were already cleared, which is the unrecoverable order.
      - ${OI_ROOT}/documents:/documents
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-net]

  mcp-gateway:
    # **The only process that holds connector credentials.** The API calls it with the gateway token; the
    # gateway reads the session row, applies the tool policy and adds the connector credential at the boundary.
    build:
      context: ${OI_ROOT}
      dockerfile: services/mcp_gateway/Dockerfile
    image: oi-core/mcp-gateway:local
    container_name: mcp-gateway
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MCP_GATEWAY_TOKEN: ${OI_MCP_TOKEN}
      MCP_TOOLS_FILE: /app/rendered/mcp_tools.json
      CONNECTOR_URL: http://host.docker.internal:8092
      AUDIT_TOOL: /app/audit.py
      AUDIT_DEV: "1"
      CONTENT_DEFAULT: ${CONTENT_DEFAULT:-hash}
      CONTENT_MODE_PUBLIC: ${CONTENT_MODE_PUBLIC:-full}
      CONTENT_MODE_INTERNAL: ${CONTENT_MODE_INTERNAL:-redacted}
      CONTENT_MODE_CONFIDENTIAL: ${CONTENT_MODE_CONFIDENTIAL:-hash}
      CONTENT_MODE_REGULATED: ${CONTENT_MODE_REGULATED:-hash}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${OI_ROOT}/rendered:/app/rendered:ro
      # The chain's one writer. A refusal that is not in the chain is not a refusal this system made.
      - ${OI_ROOT}/services/audit/audit.py:/app/audit.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-net]

  api:
    # The assistant API. The only thing a client application talks to, and the only thing that holds the
    # signing key a model call is authenticated with.
    #
    # **One worker, deliberately.** The hooks and the shared state assume one process on this box; more
    # workers would multiply anything that assumes it is alone, and the gateway's own background jobs are
    # the documented example. The reference instance has the cores for concurrency inside one process.
    build:
      context: ${OI_ROOT}
      dockerfile: services/api/Dockerfile
    image: oi-core/api:local
    container_name: api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
      OI_GATEWAY_URL: http://litellm:4000
      ACCESS_REGISTRY: /app/rendered/access.json
      OI_ASSERTION_KEY: /app/rendered/assertion.key
      AUDIT_TOOL: /app/audit.py
      EMBED_URL: http://embeddings:80
      VECTOR_URL: http://vector:6333
      COLLECTION: ${COLLECTION:-documents}
      OI_DEFAULT_MODEL_ROLE: ${OI_DEFAULT_MODEL_ROLE:-analyst}
      OI_DEFAULT_API_ROLE: ${OI_DEFAULT_API_ROLE:-viewer}

      # One profile for the answer path: accuracy or economy.
      OI_ANSWER_PROFILE: ${OI_ANSWER_PROFILE:-accuracy}
      # The audit tool's content mode, passed because the tool refuses to run without it. A model-call row
      # names a model and counts rather than text, so the policy has nothing to govern here.
      CONTENT_DEFAULT: ${CONTENT_DEFAULT:-hash}
      CONTENT_MODE_PUBLIC: ${CONTENT_MODE_PUBLIC:-full}
      CONTENT_MODE_INTERNAL: ${CONTENT_MODE_INTERNAL:-redacted}
      CONTENT_MODE_CONFIDENTIAL: ${CONTENT_MODE_CONFIDENTIAL:-hash}
      CONTENT_MODE_REGULATED: ${CONTENT_MODE_REGULATED:-hash}
      # **The workspace host, when this deployment has one.** Empty means the workspace definitions fail typed
      # rather than smuggling a shell into the API host. The token is internal to the deployment.
      OI_WORKSPACE_URL: ${OI_WORKSPACE_URL:-}
      OI_WORKSPACE_TOKEN: ${OI_WORKSPACE_TOKEN:-}
      # **The one outbound path, when the deployment has one.** Empty means a web definition fails typed.
      OI_EGRESS_URL: ${OI_EGRESS_URL:-}
      OI_EGRESS_TOKEN: ${OI_EGRESS_TOKEN:-}
      # **The MCP gateway, when the deployment has one.** The connector credential is held by the gateway, not
      # by the API and not by the sandbox.
      OI_MCP_URL: ${OI_MCP_URL:-}
      OI_MCP_TOKEN: ${OI_MCP_TOKEN:-}
    # The workspace service is on the host in the first build. The API reaches it through the Docker bridge
    # gateway; a deployment with a separate workspace host sets OI_WORKSPACE_URL to that host instead.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # The rendered registry and signing key, read-only. The API mints statements; it does not administer.
      - ${OI_ROOT}/rendered:/app/rendered:ro
      # The audit tool, so a refusal goes through the one writer of the chain.
      - ${OI_ROOT}/services/audit/audit.py:/app/audit.py:ro
      # The statement verifier, beside the tool for the same reason the audit image copies it there: the tool
      # checks the signature on a record the API writes, and both sides have to be reading one implementation.
      # Without this the tool refuses every signed row, which it did, loudly, into a log nobody was reading.
      - ${OI_ROOT}/services/gateway/assertion.py:/app/assertion.py:ro
    # **No published port.** The phase's acceptance is an API with no user interface, and a client reaches it
    # through whatever the deployment puts in front. Publishing one here would be the debug port this project
    # has already paid for once.
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
      vector:
        condition: service_started
    networks: [ai-net]

  app:
    # The client application. A static bundle behind the same small proxy the workbench uses, because the app
    # calls a relative `/api` and something has to answer it.
    #
    # **Two environment variables, and neither is a secret.** The app holds no model key and no database
    # credential: everything it knows arrives through the API. That constraint is what lets the model tier, the
    # retrieval stack and the runtime change underneath without a rewrite, so it is enforced by what this
    # service is given rather than by a comment.
    #
    # **The build context is the app's own checkout, named by an environment variable rather than inferred.**
    # The app lives in `oic-ui` and the deployment is this repository, so a build needs both trees visible. The
    # first version reached for `${OI_ROOT}/..`, which assumes the two checkouts are siblings with particular
    # names; a deployment that lays them out differently would fail with a missing file and no explanation.
    # `OI_UI_ROOT` says where the app's sources are, and a deployment sets it in `rendered/env`.
    build:
      context: ${OI_UI_ROOT:-/opt/oic-ui}
      dockerfile: ${OI_ROOT}/services/app/Dockerfile
    image: oi-core/app:local
    container_name: app
    restart: unless-stopped
    environment:
      APP_PORT: "8080"
      # **The API's root, not `/api`.** The app calls a relative `/api/ask` and the API serves `/ask`, so the
      # proxy inside this image removes the prefix. Naming it `/api` here made every call a 404 in the source
      # while the deployed image — built from a commit that stripped the prefix — kept working. The C4 panel's
      # fidelity checker found it by running the current file in a throwaway container.
      OI_API_URL: http://api:8088
    # **No published port.** A client reaches the app through whatever the deployment puts in front, the same
    # way it reaches the API. Publishing one here would be the debug port this project has already paid for.
    depends_on:
      api:
        condition: service_started
    networks: [ai-net]

  session:
    # The session boundary as a tool: establish a session, inspect one, and rehearse the refusal. It runs when
    # called and exits, like the audit sink and the retention commands.
    #
    # Its own image rather than a command inside the audit service, because it owns a table and a boundary the
    # audit service does not know about. It is NOT a second writer of the chain: the refusal is recorded by
    # invoking the audit tool, so the chain keeps exactly one definition of its own hash.
    #
    # The build context is the repository root because the image carries the access model from
    # services/retrieval as well as this service's own module: the retriever and the session tool have to agree
    # about what a root is, and one definition is the only way that stays true.
    build:
      context: ${OI_ROOT}
      dockerfile: services/session/Dockerfile
    # Tagged explicitly, like the eval and retention tools. Compose would name it oi-core-session, and a
    # probe run by hand needs an image name that is written down rather than inferred.
    image: oi-core/session:local
    container_name: session
    profiles: ["tools"]
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
      MIGRATIONS_DIR: /app/migrations
      OI_ROOT: /opt/oi-core
      # Where the rendered permission model is. Mounted rather than baked in, so a render takes effect without
      # a rebuild, and read on every run rather than cached, so a drift between the file and the running
      # deployment is not something this tool can be wrong about.
      ACCESS_REGISTRY: /app/rendered/access.json
      # The audit tool records the refusal. This service never inserts into the chain itself.
      AUDIT_TOOL: /app/audit.py
      # The content mode the audit tool applies to anything it stores. A refusal payload names fields and a
      # role rather than content, so the deployment's policy has nothing to govern here, but the tool refuses
      # to run without the variables and a second source of truth for them would be worse than passing them.
      CONTENT_DEFAULT: ${CONTENT_DEFAULT:-hash}
      CONTENT_MODE_PUBLIC: ${CONTENT_MODE_PUBLIC:-full}
      CONTENT_MODE_INTERNAL: ${CONTENT_MODE_INTERNAL:-redacted}
      CONTENT_MODE_CONFIDENTIAL: ${CONTENT_MODE_CONFIDENTIAL:-hash}
      CONTENT_MODE_REGULATED: ${CONTENT_MODE_REGULATED:-hash}
    volumes:
      - ${OI_ROOT}/rendered:/app/rendered:ro
      - ${OI_ROOT}/db/migrations:/app/migrations:ro
      # The audit tool's own code, so the refusal goes through the same writer as every other event rather
      # than through a copy of its hashing.
      - ${OI_ROOT}/services/audit/audit.py:/app/audit.py:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-net]

  audit:
    # The audit sink, as a tool rather than a service: it runs when called and exits. It is
    # where every other component will record model calls, tool calls, and approvals, so the
    # chain has one writer path instead of several. Kept out of the default profile because a
    # resident process would add a container for something that runs for a second at a time.
    build:
      context: ${OI_ROOT}
      dockerfile: services/audit/Dockerfile
    container_name: audit
    profiles: ["tools"]
    # Run as the host operator, not root: exports are evidence a human has to read, copy, and hand
    # over, and they should not be root-owned. This is also why the runbook creates the exports
    # directory as the operator before the first export.
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
      MIGRATIONS_DIR: /app/migrations
      EXPORTS_DIR: /app/exports
      # What the record may keep per data class. A policy the manifest declares and the renderer
      # writes, so the tool reads a decision rather than holding one of its own.
      CONTENT_DEFAULT: ${CONTENT_DEFAULT}
      CONTENT_MODE_PUBLIC: ${CONTENT_MODE_PUBLIC}
      CONTENT_MODE_INTERNAL: ${CONTENT_MODE_INTERNAL}
      CONTENT_MODE_CONFIDENTIAL: ${CONTENT_MODE_CONFIDENTIAL}
      CONTENT_MODE_REGULATED: ${CONTENT_MODE_REGULATED}
    volumes:
      - ${OI_ROOT}/db/migrations:/app/migrations:ro
      - ${OI_ROOT}/exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-net]

networks:
  # Created on the host during Phase 0 and shared by every deployment on this box.
  ai-net:
    external: true

volumes:
  # The ingestion worker's own state: the last cycle's outcome, which its healthcheck reads. A named
  # volume because it is that container's business and nothing else reads it. The client's documents are
  # a bind mount and read-only, because this worker has no reason to write to them.
  ingestion-state:
