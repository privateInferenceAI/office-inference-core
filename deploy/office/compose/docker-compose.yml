# Office build, Phase 1: data and gateway.
#
# Run from the repo root on the host:
#   docker compose -f deploy/office/compose/docker-compose.yml --env-file rendered/env up -d
#
# Deliberately publishes NOTHING. Services are reachable only on the ai-net bridge. The
# first security boundary is that the host has no listener to attack. Ingress arrives in a
# later phase, and it will be the only thing that ever binds a port.
#
# Images are digest-pinned with the version recorded beside the pin. That habit exists
# because an earlier stack pinned a gateway by digest with no version written down, and
# nobody could answer the first question a security review asks.

name: oi-core

services:
  postgres:
    # Stable infrastructure: version tag, because a patch release here is a tested upgrade
    # path and alpine keeps the image small on a 30 GB disk.
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${OI_ROOT}/data/postgres:/var/lib/postgresql/data
      - ${OI_ROOT}/db/migrations:/docker-entrypoint-initdb.d:ro
    networks: [ai-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  llamacpp:
    # llama.cpp server: the CPU path. It runs the local lane with no GPU and no API key,
    # which is what makes Phase 1 possible on a 2 vCPU box. When the GPU arrives, vLLM
    # replaces this container and nothing else changes, because the gateway in front of it
    # does not care which server answers.
    image: ghcr.io/ggml-org/llama.cpp@sha256:bf3da52e92c083472b3d1c9f9da081f423ab9def95a87ec4bba51940382d75fd  # llama.cpp server, pinned 2026-10-10
    container_name: llamacpp
    restart: unless-stopped
    command:
      - "-m"
      - "/models/${MODEL_FILE}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${MODEL_CTX}"
      - "-t"
      - "${MODEL_THREADS}"
      - "--jinja"
    volumes:
      - ${OI_ROOT}/models:/models:ro
    networks: [ai-net]

  litellm:
    # LiteLLM v1.104.2, pinned 2026-10-10.
    # Version matters: CVE-2026-59822 (MCP authentication bypass, CVSS 8.8, in CISA's KEV
    # catalog) affects everything before 1.84.0, and CVE-2026-42271 affects 1.74.2 to 1.83.7.
    # Model swaps, budgets, and the audit trail all live here, which is why it is the one
    # component we never leave unpinned or unversioned.
    image: ghcr.io/berriai/litellm@sha256:3d88bd757134a00e8c00237b85a021ab1f6d54abb9c1df750f411dbe7256a500
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_LOG: WARNING
    volumes:
      - ${OI_ROOT}/rendered/litellm.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      llamacpp:
        condition: service_started
    networks: [ai-net]

  qdrant:
    # Vector store. A version tag rather than a digest because this is stable infrastructure and a
    # patch release here is a tested upgrade path, not a moving target. The client library in the
    # ingestion image is pinned to the same minor version on purpose: a client newer than its server
    # is a class of bug worth avoiding by construction.
    image: qdrant/qdrant:v1.12.4   # digest fallback sha256:241edb9d7778327516ef218f8c74e1bd61b5ea42cd4f193cb8d0896199705636
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - ${OI_ROOT}/data/qdrant:/qdrant/storage
    networks: [ai-net]
    # no ports: reachable only on ai-net

  embeddings:
    # bge-m3 through Text Embeddings Inference, CPU build. Multilingual, 1024 dimensions, and good
    # enough on a 2 vCPU box for a few dozen chunks at a time. On the GPU tier this becomes the same
    # image with a CUDA tag and the same model, so nothing upstream changes.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c  # cpu-1.8, pinned 2026-10-10
    container_name: embeddings
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-m3", "--port", "80", "--max-client-batch-size", "16"]
    environment:
      HF_HOME: /data
    volumes:
      - ${OI_ROOT}/data/hf:/data
    networks: [ai-net]

  reranker:
    # bge-reranker-v2-m3. The difference between "a passage contains the words" and "a passage
    # answers the question", which is the difference between a citation a person trusts and one
    # they stop believing. Same image, different model.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:8de25e75ce39617f17f2f6c77d60a4f75b65e779ed5005420eb1400072a15c1c  # cpu-1.8, pinned 2026-10-10
    container_name: reranker
    restart: unless-stopped
    command: ["--model-id", "BAAI/bge-reranker-v2-m3", "--port", "80", "--max-client-batch-size", "16"]
    environment:
      HF_HOME: /data
    volumes:
      - ${OI_ROOT}/data/hf:/data
    networks: [ai-net]

  docs:
    # Ingestion and retrieval, as a tool rather than a service: run it when there is something to do.
    # It holds the retrieval path that the assistant API will call in Phase 4, so the logic is written
    # once and reused rather than reimplemented behind an HTTP layer.
    build:
      context: ${OI_ROOT}
      dockerfile: services/ingestion/Dockerfile
    container_name: docs
    profiles: ["tools"]
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
      DOCS_DIR: /app/documents
      QDRANT_URL: http://qdrant:6333
      EMBEDDINGS_URL: http://embeddings:80
      RERANKER_URL: http://reranker:80
      GATEWAY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ${OI_ROOT}/documents:/app/documents:ro
      - ${OI_ROOT}/db/migrations:/app/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-net]

  audit:
    # The audit sink, as a tool rather than a service: it runs when called and exits. It is
    # where every other component will record model calls, tool calls, and approvals, so the
    # chain has one writer path instead of several. Kept out of the default profile because a
    # resident process would add a container for something that runs for a second at a time.
    build:
      context: ${OI_ROOT}
      dockerfile: services/audit/Dockerfile
    container_name: audit
    profiles: ["tools"]
    # Run as the host operator, not root: exports are evidence a human has to read, copy, and hand
    # over, and they should not be root-owned. This is also why the runbook creates the exports
    # directory as the operator before the first export.
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
      MIGRATIONS_DIR: /app/migrations
      EXPORTS_DIR: /app/exports
    volumes:
      - ${OI_ROOT}/db/migrations:/app/migrations:ro
      - ${OI_ROOT}/exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-net]

networks:
  # Created on the host during Phase 0 and shared by every deployment on this box.
  ai-net:
    external: true
