# One compose file, two builds. The cloud build sends every generation call to Bedrock and starts
# the gateway and the database. The office build adds the local lane, whose container sits behind
# the "office" compose profile; the renderer turns that profile on from the manifest.
#
# Run from the repo root on the host:
#   docker compose -f deploy/office/compose/docker-compose.yml --env-file rendered/env up -d
#
# Deliberately publishes NOTHING. Services are reachable only on the ai-net bridge. The
# first security boundary is that the host has no listener to attack. Ingress arrives in a
# later phase, and it will be the only thing that ever binds a port.
#
# Images are digest-pinned with the version recorded beside the pin. That habit exists
# because an earlier stack pinned a gateway by digest with no version written down, and
# nobody could answer the first question a security review asks.

name: oi-core

services:
  postgres:
    # Stable infrastructure: version tag, because a patch release here is a tested upgrade
    # path and alpine keeps the image small on a 30 GB disk.
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ${OI_ROOT}/data/postgres:/var/lib/postgresql/data
      # Deliberately NOT mounting db/migrations into /docker-entrypoint-initdb.d. That was here
      # once, and it broke every fresh install: the entrypoint runs those files against a virgin
      # data directory, which creates our audit tables in the same database the gateway owns.
      # LiteLLM's Prisma migrations then refuse to baseline a schema they did not create, and the
      # gateway restart-loops with "Database migration cannot proceed".
      #
      # Our migrations run through `audit migrate` instead, which is the only path that is ordered,
      # checksummed, and recorded in schema_migrations. The entrypoint path only ever worked on an
      # empty data directory, so it was never the real path anyway.
    networks: [ai-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Embeddings and reranking, both on CPU through the same image, both unmodified upstream.
  # Text Embeddings Inference from Hugging Face, Apache-2.0.
  # The models are downloaded on first start into a shared cache under OI_ROOT, so a rebuild does not
  # re-download them and an air-gapped office build can ship with the cache pre-filled.
  embeddings:
    # ghcr.io/huggingface/text-embeddings-inference:cpu-1.9. The cpu- prefix is load-bearing: the
    # bare 1.9 tag is the CUDA build and fails on a box with no GPU.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    container_name: embeddings
    restart: unless-stopped
    command:
      - "--model-id=BAAI/bge-m3"
      - "--port=80"
      - "--max-batch-tokens=4096"
      - "--max-concurrent-requests=16"
    environment:
      HF_HOME: /data
      # A ten-minute first boot becomes twenty seconds with the warmup bounded.
      MAX_WARMUP_SEQUENCE_LENGTH: "256"
      MAX_WARMUP_BATCH_SIZE: "4"
    volumes:
      - ${OI_ROOT}/data/hf-cache:/data
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s

  # The reranker is a separate service because it is a separate decision: it ships only if it stays
  # inside the latency budget on this instance. See docs/search-architecture.md.
  reranker:
    # ghcr.io/huggingface/text-embeddings-inference:cpu-1.9. The cpu- prefix is load-bearing: the
    # bare 1.9 tag is the CUDA build and fails on a box with no GPU.
    image: ghcr.io/huggingface/text-embeddings-inference@sha256:2538ea1c9640d3763b15af668039d24172d063b42337b0c27796fc2be180c78d
    container_name: reranker
    restart: unless-stopped
    command:
      - "--model-id=BAAI/bge-reranker-v2-m3"
      - "--port=80"
      - "--max-batch-tokens=8192"
      - "--max-concurrent-requests=8"
    environment:
      HF_HOME: /data
      MAX_WARMUP_SEQUENCE_LENGTH: "256"
      MAX_WARMUP_BATCH_SIZE: "4"
    volumes:
      - ${OI_ROOT}/data/hf-cache:/data
    networks:
      - ai-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  # The vector store: chunks, their embeddings, and the access labels the search filters on.
  # Qdrant v1.19.2, current release line as of 2026-10-11.
  vector:
    # The image ships neither curl nor wget, so there is no healthcheck here on purpose. Readiness is
    # checked from another container, which is how the runbook proves it, and the ingestion worker
    # retries rather than assuming the store is up.
    image: qdrant/qdrant@sha256:b7b0444c4c351c970b98e90a6f89c2ee4287c65b44e52b4cb503fa5b2aa927ad
    container_name: vector
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - ${OI_ROOT}/data/qdrant:/qdrant/storage
    networks:
      - ai-net

  llamacpp:
    # llama.cpp server: the CPU path, and the local lane's only implementation. The cloud build
    # has no local lane, so this sits behind a compose profile. Gating it here rather than in a
    # second compose file is what keeps one file for both builds; the renderer sets
    # COMPOSE_PROFILES from the manifest's profile field.
    profiles: ["office"]
    image: ghcr.io/ggml-org/llama.cpp@sha256:bf3da52e92c083472b3d1c9f9da081f423ab9def95a87ec4bba51940382d75fd  # llama.cpp server, pinned 2026-10-10
    container_name: llamacpp
    restart: unless-stopped
    command:
      - "-m"
      # Defaults are empty on purpose. Compose interpolates every variable in this file whatever
      # profiles are active, so a cloud build would otherwise warn about three settings its
      # profile excludes. The renderer always writes these for an office manifest, so the empty
      # default only ever applies to the build that does not start this container.
      - "/models/${MODEL_FILE:-}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "-c"
      - "${MODEL_CTX:-8192}"
      - "-t"
      - "${MODEL_THREADS:-4}"
      - "--jinja"
    volumes:
      - ${OI_ROOT}/models:/models:ro
    networks: [ai-net]

  litellm:
    # LiteLLM v1.104.2, pinned 2026-10-10.
    # Version matters: CVE-2026-59822 (MCP authentication bypass, CVSS 8.8, in CISA's KEV
    # catalog) affects everything before 1.84.0, and CVE-2026-42271 affects 1.74.2 to 1.83.7.
    # Model swaps, budgets, and the audit trail all live here, which is why it is the one
    # component we never leave unpinned or unversioned.
    image: ghcr.io/berriai/litellm@sha256:3d88bd757134a00e8c00237b85a021ab1f6d54abb9c1df750f411dbe7256a500
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000", "--num_workers", "1"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LITELLM_LOG: WARNING
      # Bedrock, for the cloud build's frontier lane. The gateway picks up credentials from the
      # instance role through the metadata service, so no key material lands in this file. The
      # hop limit is 2, which is what lets a container reach the metadata service at all.
      AWS_REGION: ${AWS_REGION}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION}
    volumes:
      - ${OI_ROOT}/rendered/litellm.yaml:/app/config.yaml:ro
    # Deliberately no dependency on llamacpp. Compose refuses a project whose dependency sits in
    # an inactive profile ("depends on undefined service"), which would make the cloud build
    # invalid. The gateway does not need the local lane to boot: it needs it per request, and only
    # on the office build, so readiness belongs in the installer's health check rather than in an
    # ordering hint here.
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-net]

  keys:
    # Mints and updates the per-role virtual keys, and runs the drill that proves a budget is a
    # ceiling rather than a notification. A tool, like the audit sink: it runs when called and exits.
    #
    # It is deliberately the only thing besides the gateway itself that reads the master key, and it
    # reads it from the rendered env file rather than from this file's environment. That is what
    # makes the master key an administration credential instead of a shared secret, and it is why
    # no other service here has it.
    build:
      context: ${OI_ROOT}
      dockerfile: services/gateway/Dockerfile
    container_name: keys
    profiles: ["tools"]
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      LITELLM_URL: http://litellm:4000
    volumes:
      - ${OI_ROOT}/rendered:/app/rendered
    networks: [ai-net]

  audit:
    # The audit sink, as a tool rather than a service: it runs when called and exits. It is
    # where every other component will record model calls, tool calls, and approvals, so the
    # chain has one writer path instead of several. Kept out of the default profile because a
    # resident process would add a container for something that runs for a second at a time.
    build:
      context: ${OI_ROOT}
      dockerfile: services/audit/Dockerfile
    container_name: audit
    profiles: ["tools"]
    # Run as the host operator, not root: exports are evidence a human has to read, copy, and hand
    # over, and they should not be root-owned. This is also why the runbook creates the exports
    # directory as the operator before the first export.
    user: "${HOST_UID}:${HOST_GID}"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DEPLOYMENT_ID: ${DEPLOYMENT_ID}
      MIGRATIONS_DIR: /app/migrations
      EXPORTS_DIR: /app/exports
      # What the record may keep per data class. A policy the manifest declares and the renderer
      # writes, so the tool reads a decision rather than holding one of its own.
      CONTENT_DEFAULT: ${CONTENT_DEFAULT}
      CONTENT_MODE_PUBLIC: ${CONTENT_MODE_PUBLIC}
      CONTENT_MODE_INTERNAL: ${CONTENT_MODE_INTERNAL}
      CONTENT_MODE_CONFIDENTIAL: ${CONTENT_MODE_CONFIDENTIAL}
      CONTENT_MODE_REGULATED: ${CONTENT_MODE_REGULATED}
    volumes:
      - ${OI_ROOT}/db/migrations:/app/migrations:ro
      - ${OI_ROOT}/exports:/app/exports
    depends_on:
      postgres:
        condition: service_healthy
    networks: [ai-net]

networks:
  # Created on the host during Phase 0 and shared by every deployment on this box.
  ai-net:
    external: true
